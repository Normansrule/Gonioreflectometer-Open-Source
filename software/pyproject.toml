[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opengonio"
version = "0.4.0"
description = "Laptop software for OpenGonio, an open-source multispectral gonioreflectometer"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
hw = ["pyserial>=3.5", "opencv-python>=4.8"]
dev = ["pytest>=7"]

[project.scripts]
opengonio = "opengonio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
