# Final-machine power budget inputs (all phases). Laptop, ESP32-S3 hub and camera run from the
# laptop's USB, not from this battery. Consumed by tools/power_budget.py.
# SPDX-License-Identifier: CC-BY-SA-4.0
supply:                               # battery -> fuse -> e-stop -> SKR Pico (no converter in the machine path)
  bus_max_volts: 24.0                 # SKR Pico input DC 12/24 V [C12]: the charge voltage must not exceed 24 V
  path_efficiency: 0.97               # fuse + e-stop + wiring (estimate; measure as T12)
  battery:
    name: Xeanerol 6S Li-ion 5 Ah with BMS (PWR-21)   # [P49]
    nominal_volts: 21.6               # 6 x 3.6 V
    cutoff_volts: 18.0                # recharge level, 3.0 V per cell (the BMS cuts lower; its threshold is not published)
    capacity_ah: 5.0
    usable_fraction: 0.70             # 4.0 V -> 3.0 V per cell, cells not new: conservative
    max_amps: 10.0                    # pack label (BMS)
  charger:                            # USB-C charger -> PD trigger (20 V) -> DROK CC/CV -> pack
    name: DROK CC/CV (PWR-29) from a USB-C PD trigger at 20 V (PWR-27)   # [P57, P55]
    volts: 24.0                       # CV setting: 4.0 V per cell = the motor board's 24 V rating
    amps: 1.0                         # CC setting (pack label: charge 2 A max)
    usb_watts: 30.0                   # USB-C charger with a 20 V PD profile, e.g. the laptop's
    efficiency: 0.88                  # estimate; measure as T13 (LCD in vs out)
required_headroom: 0.25
loads:
  - {name: "BTT SKR Pico logic (RP2040; estimate kept from the ESP32 board)", phase: 2, typical_w: 1.0, peak_w: 1.5, idle_w: 0.8}
  - {name: "Steppers M1-M4 (TMC2209, 0.8 A RMS run)", phase: 4, typical_w: 7.0, peak_w: 21.2, idle_w: 0.0}
  - {name: "White COB, CLU7A3-0403E1 at 350 mA via NLDD-350H", phase: 6, typical_w: 4.4, peak_w: 4.9, idle_w: 0.0}
  - {name: "Multispectral LED (one band on) via NLDD-350H (BLOCKED, design.md stage 10)", phase: 10, typical_w: 0.0, peak_w: 2.1, idle_w: 0.0}   # >= 6 V x 0.35 A: the driver's minimum output
  - {name: "Wiring, fuse, terminal losses", phase: 1, typical_w: 0.1, peak_w: 0.4, idle_w: 0.02}
