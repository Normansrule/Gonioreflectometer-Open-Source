# Final-machine power budget inputs (all phases). Laptop, Pico hub and camera run from the
# laptop's USB, not from this supply. Consumed by tools/power_budget.py.
# SPDX-License-Identifier: CC-BY-SA-4.0
supply:
  name: MEAN WELL GST60A24-P1J        # [P1][P2]
  volts: 24.0
  rated_watts: 60.0
  efficiency_typical_load: 0.88       # estimate at light load
  efficiency_peak_load: 0.905         # datasheet typical [P2]
  efficiency_idle_load: 0.70          # estimate
  no_load_watts: 0.075                # [P3]
required_headroom: 0.25
loads:
  - {name: "FYSETC E4 logic (ESP32 + WiFi)", phase: 2, typical_w: 1.0, peak_w: 1.5, idle_w: 0.8}
  - {name: "Steppers M1-M4 (TMC2209, 0.8 A RMS run)", phase: 4, typical_w: 7.0, peak_w: 21.2, idle_w: 0.0}
  - {name: "White COB, CXA1304 at 350 mA via NLDD-350H", phase: 6, typical_w: 3.4, peak_w: 3.6, idle_w: 0.0}
  - {name: "Multispectral LED (one band on) via NLDD-350H", phase: 10, typical_w: 0.0, peak_w: 1.3, idle_w: 0.0}
  - {name: "Wiring, fuse, MOSFET losses", phase: 1, typical_w: 0.1, peak_w: 0.4, idle_w: 0.02}
