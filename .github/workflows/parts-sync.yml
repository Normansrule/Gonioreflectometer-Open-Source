# Edit PARTS.md on GitHub -> this applies your decisions to bom.csv, budget, checklists and figures, and commits them.
name: parts-sync
on:
  push:
    paths: ["PARTS.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e "./software[dev]" pyyaml numpy
      - run: make build
      - run: python tools/check.py
      - name: Commit the synced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "Sync parts list (PARTS.md -> bom.csv, budget, checklists)"; git push; }
