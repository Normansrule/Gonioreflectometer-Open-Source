name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e "./software[dev]" pyyaml numpy
      - run: make check test
      - name: Generated files are up to date
        run: |
          make build
          git diff --quiet || { git diff --stat; echo "::warning::generated files differ: run make (after a PARTS.md edit on GitHub, parts-sync commits them)"; }
