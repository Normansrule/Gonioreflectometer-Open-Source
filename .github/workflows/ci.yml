name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e "software[dev]"
      - run: python tools/bom_check.py --strict
      - run: python tools/power_budget.py --check
      - run: cd software && python -m pytest -q
      - name: Generated files are up to date
        run: |
          python tools/roadmap.py
          python tools/make_assets.py
          python tools/power_budget.py
          python tools/optics.py
          git diff --exit-code
