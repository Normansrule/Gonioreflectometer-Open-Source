name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e "software[dev]"
      - run: python tools/bom_check.py --check-only
      - run: python tools/power_budget.py --check
      - run: cd software && python -m pytest -q
      - name: Roadmap is in sync with milestones.yml
        run: python tools/roadmap.py --write-md && git diff --exit-code ROADMAP.md
