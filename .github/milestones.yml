# Single source of truth for the roadmap.
#   python tools/roadmap.py --write-md      -> ROADMAP.md
#   python tools/roadmap.py --github        -> GitHub milestones + one issue per item (checklists)
# Tick a box in the GitHub issue as you work; close the issue when its acceptance line passes.
# The milestone progress bar then shows the phase's real progress.

milestones:
  - id: M0
    title: "M0 - Design baseline"
    goal: "Repository, licences, interfaces and budget path agreed before anything is bought."
    due_weeks: 1
    issues:
      - id: M0.1
        title: "Answer the three open questions (Pi model, own stock, budget path)"
        labels: [planning]
        tasks:
          - "Confirm Raspberry Pi 4 or Pi 5 (power budget assumes Pi 5 worst case)"
          - "List consumables already owned (wire, perfboard, JST-XH, screws, inserts)"
          - "Choose spec / budget / budget + own stock path (see docs/05-budget-and-sourcing.md)"
          - "Update bom/master_bom.csv and re-run tools/bom_check.py"
        acceptance: "bom/summary.md shows the chosen path within every phase cap and the $500 hard cap."
      - id: M0.2
        title: "Freeze interfaces: coordinate frame, OG-40, drill map, connector registry"
        labels: [design]
        tasks:
          - "Review docs/03-architecture-interfaces.md"
          - "Create the public Onshape document with the OG globals Variable Studio"
          - "Model the REF coordinate-frame Part Studio with OG-40 mate connectors"
          - "Print the tolerance coupon and set #clear"
          - "Link the Onshape document from README.md"
        acceptance: "Onshape document public, globals match docs/03, #clear measured."
      - id: M0.3
        title: "Approve the final-machine power budget"
        labels: [design, power]
        tasks:
          - "Review docs/02-power-budget.md"
          - "Confirm 120 W adapter and buck choice"
          - "python tools/power_budget.py --check passes"
        acceptance: "Headroom >= 25 % at peak, approved in the issue."

  - id: M1
    title: "M1 - Phase 1: In-plane gonioreflectometer core"
    goal: "Light and camera move in one plane; both axes home and repeat within 0.1 deg; a mirror shows its specular peak at the mirror angle."
    cap_usd: 300
    due_weeks: 4
    issues:
      - id: M1.1
        title: "Power module"
        labels: [phase-1, power, hardware]
        tasks:
          - "Order PWR-01..PWR-18 (bom/modules/power.csv)"
          - "Confirm jack, fuse-holder, rocker cutouts from datasheets; update Onshape variables"
          - "Model and print the power box and lid"
          - "Build the protection perfboard per the netlist"
          - "Wire main path in 18 AWG, XT30s female on the box"
          - "Run acceptance tests T1-T12, fill hardware/power/acceptance_log.csv"
          - "Put measured buck efficiency into data/power_loads.yaml, re-run the budget"
          - "Export STEP + 3MF, commit with tag M1.1-power-v1"
        acceptance: "T1-T11 pass; buck efficiency >= 90 % or a recorded deviation issue."
      - id: M1.2
        title: "Controller module (Pi + SKR Mini E3 V3, fan-cooled case)"
        labels: [phase-1, controller, hardware, firmware]
        tasks:
          - "Write the 8-section module README"
          - "Order CTL lines"
          - "Model and print the case with the 40 mm fan duct"
          - "Flash Klipper (STM32G0B1, 8 KiB bootloader, USART2) and install Moonraker"
          - "Wire UART (5 V not connected), J2/J3/J4, safe-shutdown button"
          - "Apply config.txt block; verify /dev/ttyAMA0 and I2C buses"
          - "DUMP_TMC answers for X and Y drivers"
          - "Acceptance test"
        acceptance: "Klipper Ready over UART; opengantry status answers; e-stop drops the MCU and recovery works."
      - id: M1.3
        title: "Base and frame (with Phase 3/4 interfaces pre-drilled)"
        labels: [phase-1, frame, hardware]
        tasks:
          - "Write the 8-section module README"
          - "Cut the 600 x 600 base, drill the full drill map incl. ring footprint"
          - "Install tee nuts and feet; level the base"
          - "Cut 2020: two towers, centre post, two arm spars, two crossbars"
          - "Print tower feet, OG-40 adapters, centre-post turntable-height spacer"
          - "Check: tower pivot axes coaxial and through the centre within 0.5 mm"
        acceptance: "Pivot axes coaxial within 0.5 mm at the centre (string line / dial test)."
      - id: M1.4
        title: "Camera arm A1"
        labels: [phase-1, axis-A1, hardware]
        tasks:
          - "Write the 8-section module README"
          - "Model hub, 100T pulley, elbow, counterweight cage, home flag"
          - "Assemble on 608 bearings, tension belt"
          - "Balance with counterweight (arm stays put at 45 deg with motor off)"
          - "Mount TCST2103 at 85 deg and AS5600 on the axle"
          - "Home + move tests; opengantry repeatability --axis A1"
        acceptance: "20-cycle repeatability max deviation <= 0.1 deg."
      - id: M1.5
        title: "Light arm A2 (ring-ready bracket + riser)"
        labels: [phase-1, axis-A2, hardware]
        tasks:
          - "Write the 8-section module README"
          - "Same arm as A1; bracket on the OG-40 at r = 140 with the ring-stack riser"
          - "Balance, endstop, encoder"
          - "opengantry repeatability --axis A2"
        acceptance: "20-cycle repeatability max deviation <= 0.1 deg."
      - id: M1.6
        title: "Camera head"
        labels: [phase-1, camera, hardware]
        tasks:
          - "Write the 8-section module README"
          - "Model a head that fits both HQ (M12) and Camera Module 3"
          - "Route the 500 mm CSI cable along the arm through the pivot"
          - "Picamera2 RAW capture with locked exposure, gain, white balance, focus"
          - "Aim: optical axis through the centre within 0.5 mm (crosshair target)"
        acceptance: "RAW (DNG) captures at 4 elevations with the centre target within 0.5 mm of image centre."
      - id: M1.7
        title: "Light source (CRI-95 COB + constant-current driver)"
        labels: [phase-1, light, hardware]
        tasks:
          - "Write the 8-section module README"
          - "Confirm CXM-4 95-CRI bin availability and the optic"
          - "Model lamp housing with polarizer slot"
          - "Wire NLDD-350H to SKR HE0 (on/off), SET_PIN test"
          - "Thermal test: COB case <= 70 C after 30 min"
          - "Flicker check: no banding in a short-exposure capture"
        acceptance: "Lamp on/off from Klipper, case <= 70 C, no flicker bands."
      - id: M1.8
        title: "Phase 1 integration and milestone test"
        labels: [phase-1, milestone-test]
        tasks:
          - "Collision model check on hardware: approach the 9 deg minimum slowly"
          - "Both axes: 20-cycle repeatability <= 0.1 deg"
          - "Mirror on the stage: sweep A1 with A2 fixed at 20/40/60 deg; peak at A1 = A2"
          - "Record arm angle offsets from the peak positions"
          - "First in-plane reflectance curve of a paper and a plastic swatch"
          - "Tag release v0.1-phase1"
        acceptance: "Specular peak within 0.5 deg of the mirror angle (before calibration) at all three light angles."

  - id: M2
    title: "M2 - Phase 2: Calibrated swatch BRDF and first game materials"
    goal: "A fitted swatch rendered in-engine matches a photo of the swatch under the same light angle."
    cap_usd: 75
    due_weeks: 3
    issues:
      - id: M2.1
        title: "Enclosure (blackout + flock where the camera looks)"
        labels: [phase-2, enclosure]
        tasks: ["Write the module README", "Dowel frame + drape, vents clear", "Measure stray light: dark frame with lamp on, sample removed"]
        acceptance: "Stray light < 0.1 % of the PTFE signal at the same exposure."
      - id: M2.2
        title: "Calibration kit"
        labels: [phase-2, calibration]
        tasks: ["Write the module README", "Order PTFE, mirror, chrome balls", "Print holders", "Generate and print the ChArUco board, bond to glass"]
        acceptance: "All fixtures seat repeatably on the stage (re-seat 5x, < 0.2 mm)."
      - id: M2.3
        title: "RAW + HDR capture (software/hdr)"
        labels: [phase-2, software]
        tasks: ["Exposure bracketing in Picamera2", "Dark-frame subtraction", "Linear HDR merge with saturation masks", "Unit tests on synthetic data"]
        acceptance: "Merged HDR linear within 2 % across a 1000:1 range on a step target."
      - id: M2.4
        title: "Geometric calibration (software/calib)"
        labels: [phase-2, software, calibration]
        tasks: ["ChArUco intrinsics", "Arm angle offsets from mirror peaks", "Light direction from chrome-ball highlights", "Measurement-centre check"]
        acceptance: "Angle error <= 0.2 deg after calibration (mirror re-test)."
      - id: M2.5
        title: "Radiometric calibration"
        labels: [phase-2, software, calibration]
        tasks: ["PTFE reference at theta <= 60 deg", "Lamp falloff and camera response", "Reciprocity check: swap A1/A2"]
        acceptance: "Reciprocity mismatch <= 5 % on PTFE and a matte paint swatch."
      - id: M2.6
        title: "GGX fitting (software/brdf)"
        labels: [phase-2, software]
        tasks: ["In-plane sample storage format", "Lambert + GGX + Schlick fit", "Energy-conservation constraint", "Fit report plots"]
        acceptance: "RMS log-error <= 10 % on paint, plastic and rubber swatches."
      - id: M2.7
        title: "Unreal / Unity export (software/export)"
        labels: [phase-2, software]
        tasks: ["Map fit to metallic-roughness (roughness = sqrt(alpha))", "Export material JSON + textures", "Unreal and Unity import notes"]
        acceptance: "Materials import in both engines without manual edits."
      - id: M2.8
        title: "Phase 2 milestone test"
        labels: [phase-2, milestone-test]
        tasks: ["Photograph a swatch at a known light angle", "Render the fitted material in-engine at the same angles", "Side-by-side comparison in docs"]
        acceptance: "Mean colour difference in the highlight and diffuse regions visibly matches; numbers recorded."

  - id: M3
    title: "M3 - Phase 3: Full isotropic gonioreflectometer (A3 light ring)"
    goal: "A full isotropic scan of one swatch completes unattended with the collision model active."
    cap_usd: 45
    due_weeks: 2
    issues:
      - id: M3.1
        title: "Light ring module A3"
        labels: [phase-3, axis-A3, hardware]
        tasks: ["Write the 8-section module README", "Measure the lazy Susan, model sub-plate/top plate/belt rim", "Belt drive with printed idlers on 608s", "Endstop + AS5600 on motor shaft", "Uncomment A3 in printer.cfg, installed_phase: 3"]
        acceptance: "A3 homes and repeats within 0.1 deg."
      - id: M3.2
        title: "Move the light arm onto the ring"
        labels: [phase-3, axis-A2]
        tasks: ["Remove the riser, bolt the bracket to the ring top plate", "Re-check pivot coaxiality and centre within 0.5 mm"]
        acceptance: "Mirror peak still at A1 = A2 with A3 = 0."
      - id: M3.3
        title: "Isotropic scan planner with collision model"
        labels: [phase-3, software]
        tasks: ["Plan grid in (theta_i, theta_r, delta_phi)", "Skip unsafe poses, order moves to minimise travel", "Dry-run on the CAD-measured geometry", "Update machine.yaml geometry from measurements"]
        acceptance: "Planner output has zero keep-out violations; dry-run passes."
      - id: M3.4
        title: "Phase 3 milestone test"
        labels: [phase-3, milestone-test]
        tasks: ["Unattended isotropic scan of one swatch", "Fit isotropic GGX, compare to Phase 2 in-plane fit"]
        acceptance: "Scan completes unattended, no collisions, fit consistent with Phase 2."

  - id: M4
    title: "M4 - Phase 4: Anisotropic BRDF and motorised object rotation (A4)"
    goal: "A brushed-metal swatch shows its highlight stretching with turntable angle; A4 homes and repeats within 0.1 deg."
    cap_usd: 35
    due_weeks: 2
    issues:
      - id: M4.1
        title: "Turntable module A4"
        labels: [phase-4, axis-A4, hardware]
        tasks: ["Write the 8-section module README", "Hollow post top, spindle in 2 x 608, 80T pulley", "Height stage on M8 rod", "Endstop + AS5600 on spindle", "Uncomment A4, installed_phase: 4"]
        acceptance: "A4 homes and repeats within 0.1 deg; sample height unchanged from Phase 1."
      - id: M4.2
        title: "Anisotropic plans and fit"
        labels: [phase-4, software]
        tasks: ["Add absolute phi to sample storage", "Anisotropic GGX (alpha_x, alpha_y) fit", "Export anisotropy to engines"]
        acceptance: "Brushed-metal fit recovers the brushing direction within 5 deg."
      - id: M4.3
        title: "Phase 4 milestone test"
        labels: [phase-4, milestone-test]
        tasks: ["Brushed-metal swatch at 8 turntable angles", "Highlight stretch plot vs angle"]
        acceptance: "Highlight elongation follows turntable angle."

  - id: M5
    title: "M5 - Phase 5: Photo-based 3D scanner"
    goal: "A scanned test block measures within 0.5 mm of its true size and a model car mesh imports cleanly into Blender."
    cap_usd: 30
    due_weeks: 3
    issues:
      - id: M5.1
        title: "Polarizer and fill-light kit"
        labels: [phase-5, hardware]
        tasks: ["Write the 8-section module README", "Film in lamp slot; servo polarizer wheel on camera head", "Second COB + NLDD on FAN2 behind diffuser", "Cross/parallel polarization test"]
        acceptance: "Crossed polarizers suppress the mirror highlight by >= 20x."
      - id: M5.2
        title: "Scanning mat and scan planner"
        labels: [phase-5, software]
        tasks: ["Generate and print the ChArUco mat", "Plan ~145 poses (turntable x camera elevations)", "Export poses as COLMAP priors"]
        acceptance: "Plan runs unattended; every image has a pose prior."
      - id: M5.3
        title: "Photogrammetry pipeline"
        labels: [phase-5, software]
        tasks: ["COLMAP with pose priors (RealityScan / Meshroom alternatives)", "Scale from the ChArUco mat", "Mesh cleanup and export"]
        acceptance: "Test block dimensions within 0.5 mm."
      - id: M5.4
        title: "Photometric stereo detail"
        labels: [phase-5, software]
        tasks: ["Capture with the moving light", "Normal map estimation", "Merge normals onto the mesh"]
        acceptance: "Fine surface detail visible that the photogrammetry mesh misses."
      - id: M5.5
        title: "Phase 5 milestone test"
        labels: [phase-5, milestone-test]
        tasks: ["Scan the test block, measure with calipers", "Scan a 1:43 model car, import into Blender"]
        acceptance: "Block within 0.5 mm; car mesh imports cleanly."

  - id: M6
    title: "M6 - Phase 6: On-object reflectance and open-source release"
    goal: "The model car rendered in-engine matches a gantry photo under the same light; the project is public and OSHWA-ready."
    cap_usd: 0
    due_weeks: 4
    issues:
      - id: M6.1
        title: "Spatially varying BRDF fit"
        labels: [phase-6, software]
        tasks: ["Project images onto the Phase 5 mesh", "Initialise from swatch fits", "Fit base colour, roughness, metallic, normal, clear-coat per texel"]
        acceptance: "Re-rendered images match held-out captures."
      - id: M6.2
        title: "Engine export of texture maps"
        labels: [phase-6, software]
        tasks: ["Unreal material + textures", "Unity HDRP/URP material + textures"]
        acceptance: "Both engines render without manual edits."
      - id: M6.3
        title: "Phase 6 milestone test"
        labels: [phase-6, milestone-test]
        tasks: ["Gantry photo vs in-engine render, same light pose"]
        acceptance: "Visual match documented with side-by-side images."
      - id: M6.4
        title: "Open-source release and OSHWA certification"
        labels: [release]
        tasks: ["Work through docs/07-oshwa-certification.md", "Make repository and Onshape document public", "Apply for OSHWA certification", "Tag v1.0"]
        acceptance: "Public repo, OSHWA UID in README."

  - id: M7
    title: "M7 - Stretch: OpenGantry Pro (advanced track)"
    goal: "Research-grade features inspired by the Stanford Spherical Gantry, X-Rite TAC7/PANTORA and RGL-EPFL, added without breaking the Lite build."
    issues:
      - id: M7.1
        title: "Adaptive BRDF sampling (Dupuy & Jakob 2018 style)"
        labels: [stretch, software]
        tasks: ["Read the RGL-EPFL paper", "Prototype sample placement from a coarse scan", "Compare against grid sampling on MERL data"]
        acceptance: "Same fit quality with >= 3x fewer captures."
      - id: M7.2
        title: "Multi-light capture head (TAC7-style)"
        labels: [stretch, hardware]
        tasks: ["Ring of fixed LEDs around the camera", "Sequenced capture", "Power-budget update"]
        acceptance: "One pose captures N lighting directions."
      - id: M7.3
        title: "Spectral / polarization-resolved capture"
        labels: [stretch, hardware]
        tasks: ["Filter wheel or narrowband LEDs", "Full Stokes with rotating polarizer"]
        acceptance: "Per-channel BRDF of a coloured metal swatch."
      - id: M7.4
        title: "Validation against published data"
        labels: [stretch, validation]
        tasks: ["Measure a material also in the MERL or RGL databases", "Report differences"]
        acceptance: "Published comparison in docs."
