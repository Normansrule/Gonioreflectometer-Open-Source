# Roadmap source. python tools/roadmap.py --write-md | --github --repo OWNER/NAME
milestones:
  - id: M0
    title: "M0 - Design baseline"
    goal: "Architecture, interfaces and budget agreed before buying."
    due_weeks: 1
    issues:
      - id: M0.1
        title: "Confirm parts already owned and approve proposed caps"
        labels: [planning]
        tasks: ["Mark owned consumables (Stock candidate) in bom/master_bom.csv", "Approve proposed caps (docs/budget.md)", "python tools/bom_check.py --strict passes"]
        acceptance: "Buy-all total within $500 and every proposed cap."
      - id: M0.2
        title: "Freeze interfaces and start the Onshape document"
        labels: [design]
        tasks: ["Review docs/architecture.md", "Create public Onshape doc with OG globals", "REF zero-point Part Studio with OG-40 mate connectors", "Print tolerance coupon, set #clear", "Link Onshape doc in README"]
        acceptance: "Globals match docs/architecture.md; #clear measured."

  - id: M1
    title: "M1 - Phase 1: In-plane gonioreflectometer"
    goal: "Fixed camera, light arm M4 and table M3 work from the laptop and the buttons; both axes repeat within 0.1 deg; the mirror peak appears at M3 = M4/2."
    cap_usd: 347
    due_weeks: 4
    issues:
      - id: M1.1
        title: "Power module"
        labels: [phase-1, power, hardware]
        tasks: ["Order PWR lines", "Confirm jack/rocker cutouts from datasheets", "Print box and lid", "Build protection perfboard per netlist", "Wire 18 AWG, XT30 female on box", "Run T1-T10, fill acceptance_log.csv", "Export STEP + 3MF"]
        acceptance: "T1-T10 pass."
      - id: M1.2
        title: "Controller module (E4 + Pico hub + buttons)"
        labels: [phase-1, controller, firmware]
        tasks: ["Order CTL lines", "Flash FluidNC (installer.fluidnc.com), upload config.yaml", "Flash MicroPython + pico-hub/main.py", "Print case and button panel", "Wire buttons, flags, J4", "Test USB, WiFi and BT links", "Run C1-C8"]
        acceptance: "C1-C8 pass."
      - id: M1.3
        title: "Base and frame"
        labels: [phase-1, frame, hardware]
        tasks: ["Cut 600 x 600 base, drill full drill map", "Tee nuts, feet, level", "Camera outrigger + post; mark the 350 mm (BRDF) and 650 mm (scan) positions", "Print protractor scales"]
        acceptance: "Ring footprint and table post concentric within 0.5 mm."
      - id: M1.4
        title: "Light arm M4 (ring)"
        labels: [phase-1, axis-M4, hardware]
        tasks: ["Measure lazy Susan, model sub-plate/top plate/belt rim", "Belt drive with printed idlers on 608s", "Home flag at 20 deg, roller switch at ~16 deg in e-stop chain", "Set gear_ratio from measured rim", "$HX homes; moves 20-340 deg"]
        acceptance: "M4 repeatability <= 0.1 deg (camera mirror test)."
      - id: M1.5
        title: "Sample table M3"
        labels: [phase-1, axis-M3, hardware]
        tasks: ["Centre post with 2 x 608 spindle", "100T pulley, belt, motor mount", "Home flag at -180 deg", "Vertical swatch clamp"]
        acceptance: "M3 repeatability <= 0.1 deg (ChArUco pose test)."
      - id: M1.6
        title: "Fixed camera"
        labels: [phase-1, camera, hardware]
        tasks: ["L-arm mount, 16 mm lens, f/8 aperture stop", "v4l2-ctl -l: confirm manual exposure and WB", "Lock exposure/gain/WB from opengonio.camera", "Align optical axis to zero point (crosshair)"]
        acceptance: "Zero point within 0.5 mm of image centre."
      - id: M1.7
        title: "White light source"
        labels: [phase-1, light, hardware]
        tasks: ["Confirm COB stock (CXA1304 or CXM-4)", "Housing, collimation tube, aperture", "NLDD-350H on E4 HE0, M62/M63 P0", "COB case <= 70 C after 30 min"]
        acceptance: "Light toggles from laptop and LIGHT button; <= 70 C."
      - id: M1.8
        title: "Phase 1 integration"
        labels: [phase-1, milestone-test]
        tasks: ["opengonio plan mirror --theta 20/40/60 on the mirror tile", "Record specular peak positions -> axis offsets", "In-plane scan of paper and plastic swatches", "Button-only run: HOME, NEXT, LIGHT, PAUSE, STOP", "Tag v0.2-phase1"]
        acceptance: "Peak within 0.5 deg of M3 = M4/2 before calibration; repeatability <= 0.1 deg."

  - id: M2
    title: "M2 - Phase 2: Calibrated BRDF and game materials"
    goal: "A fitted swatch rendered in Unreal/Unity matches a photo under the same light angle."
    cap_usd: 73.5
    due_weeks: 3
    issues:
      - {id: M2.1, title: "Enclosure", labels: [phase-2, enclosure], tasks: ["Dowel frame + drape, vents clear", "Stray-light test"], acceptance: "Stray light < 0.1 % of PTFE signal."}
      - {id: M2.2, title: "Calibration kit", labels: [phase-2, calibration], tasks: ["PTFE, mirror tile, balls, ChArUco on glass", "Printed holders"], acceptance: "Re-seat 5x within 0.2 mm."}
      - {id: M2.3, title: "HDR from UVC frames", labels: [phase-2, software], tasks: ["Exposure ladder", "Debevec response + merge", "Validate on a step target"], acceptance: "Linear within 2 % over 1000:1."}
      - {id: M2.4, title: "Geometric calibration + per-pixel directions", labels: [phase-2, software], tasks: ["ChArUco intrinsics", "Axis offsets from mirror peaks", "Light position from chrome balls", "Per-pixel wi/wr maps"], acceptance: "Angle error <= 0.2 deg."}
      - {id: M2.5, title: "Radiometric calibration", labels: [phase-2, calibration], tasks: ["PTFE reference <= 60 deg", "Reciprocity check (swap light/view)"], acceptance: "Reciprocity mismatch <= 5 %."}
      - {id: M2.6, title: "GGX fit + engine export", labels: [phase-2, software], tasks: ["Lambert + GGX + Schlick fit with energy check", "Export Unreal / Unity material"], acceptance: "RMS log error <= 10 %; imports without edits."}
      - {id: M2.7, title: "Phase 2 milestone test", labels: [phase-2, milestone-test], tasks: ["Photo vs render at 3 light angles"], acceptance: "Side-by-side documented."}

  - id: M3
    title: "M3 - Phase 3: Isotropic BRDF (add M2 tilt)"
    goal: "Full isotropic scan of one swatch runs unattended with the collision model active."
    cap_usd: 22.5
    due_weeks: 2
    issues:
      - {id: M3.1, title: "Tilt yoke M2", labels: [phase-3, axis-M2, hardware], tasks: ["Yoke on table flange", "Drive, home flag at -90", "installed_phase: 3"], acceptance: "M2 repeatability <= 0.1 deg; zero point unchanged."}
      - {id: M3.2, title: "Isotropic planner", labels: [phase-3, software], tasks: ["Grid in (theta_i, theta_r, delta_phi) -> (M4, M3, M2)", "Skip unmeasurable/unsafe poses", "Dry-run"], acceptance: "Zero violations."}
      - {id: M3.3, title: "Phase 3 milestone test", labels: [phase-3, milestone-test], tasks: ["Unattended isotropic scan", "Fit vs Phase 2"], acceptance: "Completes unattended; consistent fit."}

  - id: M4
    title: "M4 - Phase 4: Anisotropic BRDF and SVBRDF (add M1 spin)"
    goal: "Brushed metal highlight follows M1; per-pixel SVBRDF of a textured swatch."
    cap_usd: 22.5
    due_weeks: 2
    issues:
      - {id: M4.1, title: "Spin platter M1", labels: [phase-4, axis-M1, hardware], tasks: ["Platter on yoke", "Spindle hub accepts scan-kit risers (Phase 6)", "Home flag on TH0", "installed_phase: 4"], acceptance: "M1 repeatability <= 0.1 deg."}
      - {id: M4.2, title: "Anisotropic + SVBRDF fit", labels: [phase-4, software], tasks: ["Anisotropic GGX", "Per-pixel fit with per-pixel directions"], acceptance: "Brushing direction within 5 deg."}
      - {id: M4.3, title: "Phase 4 milestone test", labels: [phase-4, milestone-test], tasks: ["Brushed metal at 8 M1 angles"], acceptance: "Highlight stretch follows M1."}

  - id: M5
    title: "M5 - Phase 5: Multispectral and polarization"
    goal: "Eight-band reflectance of a colour target repeats within 3 %; crossed polarizers separate specular from diffuse."
    cap_usd: 30
    due_weeks: 2
    issues:
      - {id: M5.1, title: "LED bank on the 40 deg mast", labels: [phase-5, hardware], tasks: ["Choose 8 bands (~420-660 nm)", "Print LED ring + 40 deg mast on the light arm", "NLDD-350H on E4 GPIO4, ULN2803A from Pico GP8-15", "Collision model includes the mast"], acceptance: "Each band on/off from laptop and buttons; mast clears the camera at M4 = 20 deg."}
      - {id: M5.2, title: "Polarizers", labels: [phase-5, hardware], tasks: ["Film in the lamp slot", "Rotatable lens disc with index marks"], acceptance: "Crossed polarizers cut the mirror highlight >= 20x."}
      - {id: M5.3, title: "Spectral calibration", labels: [phase-5, software], tasks: ["Per-band PTFE reference", "Per-band light direction (mast elevation) in kinematics", "Colour target check (borrowed)"], acceptance: "Band ratios repeat within 3 %."}
      - {id: M5.4, title: "Phase 5 milestone test", labels: [phase-5, milestone-test], tasks: ["Multispectral in-plane BRDF of two paints that look alike in RGB"], acceptance: "Paints separated in at least one band."}

  - id: M6
    title: "M6 - Phase 6: 3D photo scanner"
    goal: "A 40 mm printed cube scans to within 0.5 mm on every edge, and a 1:43 model car mesh imports cleanly into Blender."
    cap_usd: 4.5
    due_weeks: 3
    issues:
      - id: M6.1
        title: "Scan kit hardware"
        labels: [phase-6, scanner, hardware]
        tasks: ["Print risers 60/40/20/0 mm (delta = 60 - riser), nest, 650 mm camera stop, outrigger end foot", "Buy putty; print the ChArUco mat", "Check object sphere r = 55 clears the light arm in ASM - Phase 6"]
        acceptance: "Putty holds a 100 g object at 80 deg elevation for 3 turns (test S3)."
      - id: M6.2
        title: "Scan-mode camera"
        labels: [phase-6, scanner, camera]
        tasks: ["Slide to 650 mm, f/8 stop, refocus, lock", "opengonio scan calibrate: ChArUco intrinsics + distortion + measured camera pose", "Set scan.calibration in machine.yaml; keep the BRDF-mode (350 mm) profile"]
        acceptance: "Reprojection RMS <= 0.5 px (test S1)."
      - id: M6.3
        title: "Scan planner and known poses"
        labels: [phase-6, scanner, software]
        tasks: ["opengonio scan plan: rings 0/20/40/60/80 deg, 144 views", "Object-frame poses from M1/M2/M3 + platter offset", "Joint fit of camera pose + board placement (AX = YB) at 12 poses"]
        acceptance: "Kinematic pose within 0.2 deg / 0.3 mm of solvePnP (test S2)."
      - id: M6.4
        title: "Capture run"
        labels: [phase-6, scanner, software]
        tasks: ["opengonio scan run: lamp at M4 = 30 deg, crossed polarizers", "Locked exposure; frames saved as img_0000.jpg ...", "Buttons: START runs the scan, PAUSE/STOP work mid-scan", "scan.json with poses and settings"]
        acceptance: "144 sharp frames, no motion blur, unattended."
      - id: M6.5
        title: "Visual hull preview"
        labels: [phase-6, scanner, software]
        tasks: ["Empty-platter background pass (scan run --background)", "Silhouettes by background differencing", "Voxel carving with known poses, clipped at the support plane", "PLY preview in under 1 min on the laptop"]
        acceptance: "40 mm cube hull edges within 1 mm (test S4)."
      - id: M6.6
        title: "Photogrammetry with pose priors"
        labels: [phase-6, scanner, software]
        tasks: ["Export COLMAP model (OPENCV camera when calibrated)", "run_colmap.sh: feature_extractor -> sync-ids -> point_triangulator -> patch_match_stereo (CUDA) -> stereo_fusion -> poisson_mesher", "Optional bundle_adjuster + model_aligner to the kinematic camera centres", "No CUDA: Meshroom / OpenMVS / RealityScan", "Mesh units = mm"]
        acceptance: "Dense mesh of the cube, no manual alignment."
      - id: M6.7
        title: "Photometric stereo detail"
        labels: [phase-6, scanner, software]
        tasks: ["PS stations every 60 deg of M1 at 30 deg elevation", "LED bank band, 6 M4 positions (non-coplanar via the 40 deg mast)", "Light positions refined with chrome balls; near-light directions + 1/r^2 from the hull or mesh", "Merge normals into a normal map on the mesh"]
        acceptance: "Matte sphere median normal error <= 5 deg (test S6)."
      - id: M6.8
        title: "Phase 6 milestone test"
        labels: [phase-6, milestone-test]
        tasks: ["Scan the 40 mm cube, measure edges in the mesh", "Scan a 1:43 car (flip once for the underside, merge)", "Import PLY/OBJ/glTF into Blender"]
        acceptance: "Cube edges 40.0 +/- 0.5 mm; car imports without repair (tests S5, S7)."

  - id: M7
    title: "M7 - Phase 7: On-object appearance"
    goal: "The scanned model car rendered in-engine matches a gantry photo under the same light."
    cap_usd: 0
    due_weeks: 4
    issues:
      - {id: M7.1, title: "Project captures onto the mesh", labels: [phase-7, software], tasks: ["UV-unwrap the mesh", "Per-texel visibility over all views and light positions", "Per-pixel directions from the known poses"], acceptance: "Each texel has >= 20 valid observations."}
      - {id: M7.2, title: "Per-texel SVBRDF fit", labels: [phase-7, software], tasks: ["Initialise from Phase 2-4 swatch fits", "Fit base colour, roughness, metallic, clear-coat; normals from PS", "Energy and reciprocity checks"], acceptance: "Held-out images reproduced within 10 % RMS."}
      - {id: M7.3, title: "Engine export", labels: [phase-7, software], tasks: ["glTF 2.0 with PBR textures", "Unreal and Unity material setup"], acceptance: "Imports in both engines without edits."}
      - {id: M7.4, title: "Phase 7 milestone test", labels: [phase-7, milestone-test], tasks: ["Gantry photo vs in-engine render, same light pose"], acceptance: "Side-by-side published in docs."}

  - id: M8
    title: "M8 - OpenGonio Studio (laptop app)"
    goal: "Every workflow (BRDF scan, multispectral, 3D scan) runs from one laptop app or the physical buttons, with no terminal."
    due_weeks: 3
    issues:
      - {id: M8.1, title: "Local web UI", labels: [software, app], tasks: ["Connect USB / WiFi / Bluetooth", "Live camera view with exposure lock", "Jog, home, light controls", "Collision preview from the simulator code"], acceptance: "Full Phase 1 run from the browser."}
      - {id: M8.2, title: "Workflow presets", labels: [software, app], tasks: ["BRDF swatch, multispectral, 3D scan presets", "Buttons map to the selected preset", "Progress and ETA"], acceptance: "Each preset runs unattended from START."}
      - {id: M8.3, title: "Data management", labels: [software, app], tasks: ["Session folders with scan.json", "Resume after STOP / e-stop", "Export bundle (images, model, materials)"], acceptance: "Interrupted scan resumes without re-capturing done poses."}

  - id: M9
    title: "M9 - Release and certification"
    goal: "Public, documented, OSHWA-certified open hardware with a v1.0 release."
    due_weeks: 2
    issues:
      - {id: M9.1, title: "Documentation pass", labels: [release, docs], tasks: ["All modules have 8 sections", "Build video or GIF per phase", "STEP + 3MF for every printed part"], acceptance: "A new builder completes Phase 1 from the docs alone."}
      - {id: M9.2, title: "Make public + OSHWA", labels: [release], tasks: ["docs/licensing.md checklist", "Repo and Onshape public", "Apply for OSHWA certification"], acceptance: "OSHWA UID in README."}
      - {id: M9.3, title: "v1.0 release", labels: [release], tasks: ["Tag v1.0", "Release notes with measured accuracy numbers"], acceptance: "Release published."}

  - id: M10
    title: "M10 - Stretch: research-grade upgrades"
    goal: "Upgrades from published rigs without breaking the low-cost build."
    issues:
      - {id: M10.1, title: "Adaptive BRDF sampling", labels: [stretch, software], tasks: ["Prototype RGL-EPFL-style adaptive sampling [R15]"], acceptance: "Same fit with >= 3x fewer captures."}
      - {id: M10.2, title: "Mono camera + filter wheel multispectral", labels: [stretch, hardware], tasks: ["Compare with LED bands; follow the channel design of [R1]"], acceptance: "Documented comparison."}
      - {id: M10.3, title: "Space carving with photo-consistency", labels: [stretch, software], tasks: ["Extend the visual hull to space carving [S7]"], acceptance: "Concavities recovered on a test bowl."}
      - {id: M10.4, title: "Validation vs MERL / RGL data", labels: [stretch, validation], tasks: ["Measure a shared material [R13][R16]"], acceptance: "Published comparison."}
