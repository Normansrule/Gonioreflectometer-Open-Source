    - First move runs.
    - 'Second prints `refused: M4=10.0 outside [20.0, 324.0]` and nothing moves.'
    record: Commit `make publish m="M16 table done"`.
- id: M17
  stage: 06-camera-light
  title: Camera sees the zero point
  goal: Sharp, fixed-exposure image centred on the sample.
  weeks: 2
  steps:
  - id: M17.1
    title: Camera reaches the software
    time: 30 min
    needs:
    - CAM-01 camera
    - Windows PowerShell (or a Linux laptop)
    do:
    - 'WSL''s standard kernel has no USB-camera driver, so camera stages run `opengonio` from Windows Python. PowerShell, in the repo folder (`cd \\wsl.localhost\Ubuntu\home\<you>\projects\Gonioreflectometer-Open-Source`):'
    - '`py -m venv $HOME\og-win; & $HOME\og-win\Scripts\pip install "./software[hw]"`'
    - '`usbipd detach --busid <E4 busid>` (Windows keeps the E4 as a COM port); set `controller.port: COM5` (your port) in `machine.yaml`.'
    - '`& $HOME\og-win\Scripts\opengonio status`'
    verify:
    - '`status` prints `<Idle|` or `<Alarm|`.'
    - '`& $HOME\og-win\Scripts\python -c "import cv2; print(cv2.VideoCapture(0).read()[0])"` prints `True`.'
    fail:
    - '`False`: camera index is 1 (laptop webcam is 0); set `camera.index: 1`.'
    - 'Linux laptop instead: everything runs natively; `v4l2-ctl --list-devices` shows the camera.'
    record: Which setup you use in phases/06-camera-light/design.md → Results.
  - id: M17.2
    title: Mount
    time: 1.25 h
    wait: print 1 h
    needs:
    - CAM-01 camera
    - CAM-02 lens
    - CAM-03 prints
    - TLS-09 utility knife + 400-grit paper
    do:
    - 'Order the stage-06 parts ticked in `PARTS.md`, plus CAL-01 PTFE, CAL-02 mirror (stage 07): M17.5–M19 use them. Print `CAM-03a_aperture_stop_f8.stl`, `CAM-03b_camera_plate.stl`, `CAL-06a/b` holders.'
    - 'Camera board on the plate: 4 × M2.5 × 8 (CAM-07) self-tap into the 6 mm standoffs.'
    - 'Plate on the camera pillar: slide its clamp down to the pilot hole, M5 × 10 self-taps into it; aperture stop in front of the lens.'
    - 'White tile (CAL-01): mark one 100 × 100 mm PTFE sheet into four 50 mm squares (lines at 50 mm both ways); cut each line with the utility knife against a straight edge, 4–6 light passes, never through
      in one go. Stack 3 squares (9 mm) in the `CAL-06a` holder; sand the top one with 400 grit in circles until evenly matte; blow off the dust, don''t touch the face.'
    verify:
    - 'Tape measure zero point → lens front: 350 ± 2 mm; camera axis level (phone level app on the plate).'
    - PTFE stack sits flush with the holder rim; no shiny patches on the top face.
    record: Tick the boxes; `make done id=M17.2`.
  - id: M17.3
    title: Focus
    time: 30 min
    needs:
    - printed 1 mm grid
    do:
    - 'Grid at the zero point. Live view: Windows *Camera* app (or `guvcview` on Linux).'
    - Turn the lens for the sharpest grid; lock it with the M12 lock ring.
    verify:
    - 1 mm lines resolved across the whole image.
    record: Image as `phases/06-camera-light/focus.jpg`.
  - id: M17.4
    title: Centre
    time: 15 min
    needs:
    - table centre mark
    do:
    - Image the table centre mark; find its pixel position (any image viewer).
    verify:
    - Within ±15 px of the image centre (= ±0.5 mm).
    fail:
    - 'Off-centre: shim the camera board on its standoffs (paper or tape layers), or the plate''s clamp on the pillar.'
    record: Offset (px) in design.md.
  - id: M17.5
    title: Lock exposure and colour
    time: 30 min
    needs:
    - CAL-01 PTFE in its holder (or CAL-07 grey card if you bought it)
    do:
    - Lock exposure, gain, white balance (`v4l2-ctl` lines in `software/src/opengonio/camera/uvc.py`).
    - Two frames of the PTFE tile 60 s apart.
    verify:
    - Mean grey of the two frames differs < 1 %.
    fail:
    - 'Drifts: auto exposure still on; `v4l2-ctl -l` and set `auto_exposure=1`.'
    record: Locked values into `machine.yaml` → `camera:` (`exposure_ms`); commit.
- id: M18
  stage: 06-camera-light
  title: Lamp on and safe
  goal: Light switches from the laptop, stays cool and steady.
  weeks: 1
  steps:
  - id: M18.1
    title: Lamp assembly
    time: 1 h
    wait: print 2 h
    needs:
    - LSR-01 COB
    - LSR-06 holder
    - LSR-02 driver
    - LSR-03 heatsink
    - LSR-04 tape
    - LSR-05 print
    - PWR-15 18 AWG offcuts (2 × 15 cm)
    - PWR-20 lever connectors
    - TLS-04 stripper
    do:
    - Print `LSR-05a_lamp_tube`, `LSR-05b_lamp_cap`. Strip one end of a 15 cm red and a 15 cm black 18 AWG lead (PWR-15) to the length in the holder's instruction sheet; push red into the holder's `+` poke-in,
      black into `−`.
    - Holder face-down in the body's round seat, wire entries toward the lead groove (the side away from the clamp), leads along the groove. COB into the holder's square seat, light-emitting face down through
      the window. Thermal tape (LSR-04) on the COB's back; heatsink on top, fins out. Cap on with 4 × M3 × 8, leads through its slot; tighten evenly until the heatsink no longer turns.
    - Lamp clamp onto the horizontal arm (M5 × 10 + T-nut), aperture facing the zero point.
    - Driver (LSR-02) pins into the breadboard. +Vin row ← 24 V sense row; −Vin row → E4 HE0 `−` (cut jumper under the screw).
    - Driver +Vo / −Vo rows → two chains of 5 male–female jumpers along the arm (slack for 20–324°); at the lamp, lever connectors join each chain's last female end (cut off, stripped, folded double) to
      the lamp's red (+) / black (−) lead.
    verify:
    - Each lead holds when tugged (poke-in locked).
    - 'Polarity checked with the meter before power: +Vo row → red lead beeps.'
    record: Tick the boxes; `make done id=M18.1`.
  - id: M18.2
    title: Switch and heat
    time: 20 min
    needs:
    - TLS-05 temperature probe
    - '`installed_phase: 6`'
    do:
    - '`opengonio light on`; wait 10 min; `opengonio light off`. Repeat on/off 5 ×.'
    verify:
    - Lamp follows every command.
    - COB case ≤ 70 °C after 10 min.
    fail:
    - 'Lamp always on: driver −Vin on GND instead of HE0.'
    record: Temperature in phases/06-camera-light/design.md → Results.
  - id: M18.3
    title: Warm-up time
    time: 15 min
    wait: 10 min run
    needs:
    - PTFE tile or grey card
    - room dark
    do:
    - '`opengonio capture warmup --minutes 10 --out data/warmup`'
    - Set `lights.white.warmup_s` in `machine.yaml` to the printed value.
    verify:
    - '`settle_s` ≤ 300.'
    fail:
    - 'Longer: thermal pad missing or driver current too high (check LSR-02 is the 350 mA part).'
    record: '`settle_s`, `change_pct` in design.md; commit.'
- id: M19
  stage: 06-camera-light
  title: Mirror test
  goal: First real data proves the angles are right.
  weeks: 1
  steps:
  - id: M19.1
    title: Mirror sweeps
    time: 30 min
    needs:
    - CAL-02 mirror
    - CAL-06b holder (print)
    do:
    - Mirror in `CAL-06b_mirror_holder`, clamped on the table.
    - '`opengonio capture mirror --theta 20`, then `--theta 40`, then `--theta 60`.'
    - '`opengonio verify data/mirror_20 data/mirror_40 data/mirror_60`'
    - '`opengonio curve data/mirror_40`; open `data/mirror_40/curve.svg`.'
    verify:
    - Each `mirror_peak_error_deg` between −0.5 and +0.5.
    - The chart's peak sits within one dot of the orange line.
    fail:
    - 'Same sign every time: table zero offset — fixed in M22.2.'
    - 'No clear peak: mirror not facing the camera at M3 = 0; reseat the holder.'
    record: Three errors in phases/06-camera-light/design.md → Results; commit.
- id: M20
  stage: 06-camera-light
  title: First reflectance curves
  goal: Two real materials measured and pictured.
  weeks: 1
  steps:
  - id: M20.1
    title: Paper
    time: 20 min
    needs:
    - matte printer paper
    do:
    - Clamp the paper on the table.
    - '`opengonio capture inplane --step 10 --out data/paper`'
    - '`opengonio verify data/paper`'
    - '`opengonio curve data/paper`; open `curve.svg`.'
    verify:
    - 'verify: `lamp_drift_pct` within ±2, `result` PASS.'
    - 'Chart: flat-ish curves; centre_mean ÷ cos(θr) varies < 15 % for θr ≤ 60° at a fixed θi (from `curve.csv`).'
    fail:
    - 'Drift FAIL: raise `warmup_s`; check the lamp heatsink.'
    record: '`curve.csv` + `curve.svg` → `phases/06-camera-light/paper_*`.'
  - id: M20.2
    title: Glossy plastic
    time: 20 min
    needs:
    - acrylic sheet or flat LEGO plate
    do:
    - Clamp it.
    - '`opengonio capture inplane --step 10 --out data/plastic`; `opengonio verify data/plastic`; `opengonio curve data/plastic`.'
    verify:
    - Each θi curve peaks at θr = θi ± 10° (chart).
    record: '`curve.csv` + `curve.svg` → `phases/06-camera-light/plastic_*`; commit.'
- id: M21
  stage: 07-calibrate
  title: Dark box
  goal: Only the lamp lights the sample.
  weeks: 1
  steps:
  - id: M21.1
    title: Darken the room
    time: 20 min
    needs:
    - ENC-02 felt
    - curtains / door
    - tape over bright LEDs
    do:
    - Order the stage-07 parts ticked in `PARTS.md`. Felt behind the sample (opposite the camera).
    - Room lights off, curtains closed, tape over power LEDs that face the sample; laptop screen dimmed and turned away.
    - 'Only if M21.2 fails: build the optional drape (ENC-01 fabric on ENC-03 dowels in 4 printed `ENC-04a` sockets), vents of both boxes open.'
    verify:
    - Standing at the machine, you can't read the template text without the lamp.
    record: Tick the boxes; `make done id=M21.1`.
  - id: M21.2
    title: Stray light test
    time: 15 min
    needs:
    - PTFE tile (CAL-01)
    - darkened room
    do:
    - PTFE at 45:0 (`opengonio move M4=45 M3=0`). Room lights on.
    - '`opengonio capture white --out data/stray_on`; then the same with the room light on: `--out data/stray_gap`.'
    verify:
    - 'Dark vs lit room: centre brightness differs < 0.5 % (`opengonio curve` each, compare `centre_mean`): ambient light is negligible.'
    fail:
    - 'Larger: find the source (window, monitor) and block it; if you can''t, build the optional drape (M21.1) and repeat.'
    record: Both values in phases/07-calibrate/design.md → Results.
  - id: M21.3
    title: Dark level
    time: 10 min
    needs:
    - room dark (drape closed if built)
    do:
    - '`opengonio capture dark`'
    - '`opengonio calibrate dark data/dark`'
    verify:
    - '`opengonio calibrate show` lists `dark_counts` < 10 with today''s date.'
    fail:
    - 'High: light leak or camera gain not locked (M17.5).'
    record: Commit `software/config/calibration.yaml`.
- id: M22
  stage: 07-calibrate
  title: Camera response and angle calibration
  goal: Linear brightness and true angles.
  weeks: 1
  steps:
  - id: M22.1
    title: Camera response
    time: 20 min
    needs:
    - PTFE at the zero point
    - M21.3 done
    do:
    - '`opengonio capture linearity`'
    - '`opengonio calibrate linearity data/linearity`'
    verify:
    - '`r2` ≥ 0.995 and `gamma` between 0.9 and 2.6; `points_used` ≥ 4.'
    fail:
    - '`points_used` < 3: change `--exposures` so the brightest is just below saturation (e.g. `--exposures 1 2 4 8 16 32`).'
    record: '`gamma`, `r2` in design.md; commit `calibration.yaml`.'
  - id: M22.2
    title: Angle offset
    time: 45 min
    needs:
    - mirror holder
    do:
    - '`opengonio capture mirror --theta 20` … repeat for 30, 40, 50, 60.'
    - '`opengonio calibrate mirror data/mirror_20 data/mirror_30 data/mirror_40 data/mirror_50 data/mirror_60`'
    - '`opengonio capture mirror --theta 40 --out data/mirror_40_after`; `opengonio verify data/mirror_40_after`'
    verify:
    - '`calibrate` prints five errors and `M3_offset_deg`.'
    - 'After: `mirror_peak_error_deg` within ±0.2.'
    fail:
    - 'Errors grow with θ: M4 gear ratio wrong (M14.3), not an offset.'
    record: Five errors + offset in design.md; commit `calibration.yaml`.
- id: M23
  stage: 07-calibrate
  title: Brightness calibration
  goal: Values in real reflectance units (1/sr).
  weeks: 1
  steps:
  - id: M23.1
    title: White reference
    time: 15 min
    needs:
    - CAL-01 PTFE in CAL-06a holder
    do:
    - '`opengonio capture white`'
    - '`opengonio calibrate white data/white --rho 0.99` (ρ from the PTFE datasheet).'
    verify:
    - '`calibrate show` lists `white` with today''s date and `exposure_ms` = your locked exposure.'
    record: Commit `calibration.yaml`.
  - id: M23.2
    title: PTFE check
    time: 20 min
    needs:
    - PTFE still mounted
    do:
    - '`opengonio capture inplane --step 10 --out data/ptfe`; `opengonio curve data/ptfe`.'
    verify:
    - '`brdf_per_sr` = 0.315 ± 5 % for θi ≤ 60°, θr ≤ 60° (0.99 / π).'
    fail:
    - 'Falls with θi: lamp spot smaller than the sample at grazing angles — check the aperture in LSR-05.'
    - 'Uniformly off: exposure changed since `calibrate white`; redo M23.1.'
    record: Min / max `brdf_per_sr` in design.md.
  - id: M23.3
    title: Reciprocity
    time: 30 min
    needs:
    - matte swatch (card or paper)
    do:
    - '`opengonio capture inplane --step 10 --out data/matte`; `opengonio curve data/matte`.'
    - Compare rows (θi, θr) = (30, 50) and (50, 30).
    verify:
    - The two `brdf_per_sr` values agree within 5 %.
    fail:
    - 'Larger: angle calibration (M22.2) or stray light (M21.2).'
    record: Both values in design.md; commit.
- id: M24
  stage: 07-calibrate
  title: First game material
  goal: A measured swatch looks right in Blender, Unreal or Unity.
  weeks: 1
  steps:
  - id: M24.1
    title: Measure
    time: 40 min
    needs:
    - glossy plastic swatch
    do:
    - '`opengonio capture inplane --step 5 --out data/swatch`'
    - '`opengonio verify data/swatch`; `opengonio curve data/swatch`'
    verify:
    - '`result` PASS (or WARN with only `saturated` ≤ 5 % of shots).'
    - '`curve.csv`: `brdf_per_sr` filled on every unsaturated row.'
    record: Tick the boxes; `make done id=M24.1`.
  - id: M24.2
    title: Fit
    time: 10 min
    needs:
    - M24.1
    do:
    - '`opengonio fit data/swatch`; open `data/swatch/fit.svg`.'
    verify:
    - '`rms_pct_of_peak` < 10.'
    - Fitted lines pass through the dots around each peak.
    fail:
    - 'Big error only near grazing angles: normal; refit with `--step 10` data, or ignore θ > 70°.'
    record: Copy `fit.json` to `phases/07-calibrate/swatch_fit.json`.
  - id: M24.3
    title: In a game engine
    time: 1 h
    needs:
    - Blender (free), Unreal or Unity
    - photo of the swatch at θi = 40°
    do:
    - 'New material with the values under `engines` in `fit.json` (Blender: Principled BSDF Base Color, Roughness, Metallic).'
    - Plane + point light at 40° from the normal, camera at the mirror angle; render.
    verify:
    - 'Side by side with the photo: highlight size and position match by eye.'
    record: '`phases/07-calibrate/render_vs_photo.png`; commit `make publish m="M24 first material"`.'
- id: M25
  stage: 08-tilt
  title: Tilt yoke built and homed
  goal: Sample tilts without leaving the zero point.
  weeks: 2
  steps:
  - id: M25.1
    title: Print
    time: 10 min
    wait: print 9 h
    needs:
    - stage-08 and stage-09 parts `have` in `PARTS.md`
    do:
    - Print `TLT-07a_tilt_yoke.stl` (upright, 184 mm tall), `TLT-07b_pulley_100T.stl`, `TLT-07c_tilt_cradle.stl`, `SPN-07a_spin_platter.stl` (top face down).
    verify:
    - A 608 presses into each arm seat; an M8 nut drops into each cradle trap and can't turn.
    record: Tick the boxes; `make done id=M25.1`.
  - id: M25.2
    title: Cradle, platter and stub axles
    time: 1 h
    needs:
    - 2 × 608
    - TLT-05 2 × M8 × 35 + nuts
    - spacers (TBL-07f)
    - SPN-01 pancake motor
    - 4 × M3 × 8, 4 × M4 × 16
    - M3 grub or M3 × 8 + nut
    - TLS-10 spanner
    do:
    - 'Pancake motor under the cradle floor (shaft up through it, 4 × M3 × 8). Platter on the shaft: M3 nut in its slot, grub onto the D flat; platter top level with the stub-bolt axis (the end blocks stand
      10 mm higher).'
    - 'Yoke on the drum (4 × M4 × 16 self-tap into the OG-40 holes) with its arms along ±Y: at M3 = 0 the tilt axis is square to the camera direction (+X) and the flag holes on the drum stay clear. The
      pulley-side arm is +Y.'
    - 'Pulley side: bolt through 100T pulley → 1 mm shim → 608 (outer face of the arm) → 6.8 mm spacer → cradle nut. Other side: the same with the 9.4 mm spacer instead of the pulley. Hold each bolt head
      with the spanner; snug, not tight.'
    verify:
    - Cradle tilts ±90° by hand, no play you can feel at the platter edge.
    - Platter top level with the bolt axis (ruler across both bolt centres).
    fail:
    - 'Binds: over-tightened; back off 1/6 turn.'
    record: Tick the boxes; `make done id=M25.2`.
  - id: M25.3
    title: Tilt drive and flag
    time: 45 min
    needs:
    - TLT-01 motor
    - TLT-02 280 mm belt
    - TLT-03 pulley
    - TLT-04 endstop
    - TBL-07b flag
    - 4 × M3 × 8
    do:
    - Motor on the inner face of the pulley-side arm above the axis, shaft out through the arm slot (4 × M3 × 8 in the slots); 20T pulley outside, level with the 100T; belt on; slide the motor up to tension
      (~3 mm deflection); tighten.
    - Flag on a cradle end block at −90°; endstop on the arm; lead into the E4 Z-MIN socket (CTL-06, as M10.3).
    verify:
    - '`?` shows `Pn:Z` with the flag in the slot.'
    - Belt doesn't skip when you hold the platter and jog `M2` slowly.
    record: Tick the boxes; `make done id=M25.3`.
  - id: M25.4
    title: Home and repeat
    time: 1 h
    needs:
    - laser + mirror
    - wall 2.0 m
    do:
    - '`installed_phase: 8`; `opengonio home` × 10.'
    - '`opengonio move M2=0`: platter vertical (phone level app on its face).'
    - 'Mirror on the platter: `opengonio repeat M2 --at 0 --away 30 --n 20`.'
    verify:
    - Home 10/10.
    - Platter vertical within ±0.5° at M2 = 0.
    - '`"pass": true`.'
    record: JSON in phases/08-tilt/design.md → Results.
  - id: M25.5
    title: Zero point stays
    time: 20 min
    needs:
    - sample-centre mark
    do:
    - '`opengonio move M2=-45`, capture a frame; `M2=45`, capture a frame; compare the mark position.'
    verify:
    - Mark moves < 15 px (0.5 mm).
    fail:
    - 'Larger: platter surface not on the bolt axis; move the platter on the shaft (grub) and redo.'
    record: Shift (px) in design.md; commit.
- id: M26
  stage: 08-tilt
  title: Full isotropic scan
  goal: All light directions, unattended.
  weeks: 1
  steps:
  - id: M26.1
    title: Plan check
    time: 5 min
    needs:
    - '`installed_phase: 8`'
    do:
    - '`opengonio plan isotropic --step 15`'
    verify:
    - '`poses` ≥ 100 and `axes` includes `M2`.'
    record: Tick the boxes; `make done id=M26.1`.
  - id: M26.2
    title: Run
    time: 10 min
    wait: ~15 min unattended
    needs:
    - glossy plastic swatch on the yoke
    do:
    - '`opengonio capture isotropic --step 15 --out data/iso_plastic` (or station job *Isotropic 15deg*).'
    - Don't touch the machine until it finishes.
    verify:
    - '`opengonio verify data/iso_plastic`: PASS, or WARN with only `saturated` ≤ 5 % of shots.'
    record: Tick the boxes; `make done id=M26.2`.
  - id: M26.3
    title: Fit and compare
    time: 15 min
    needs:
    - M24 swatch fit
    do:
    - '`opengonio curve data/iso_plastic && opengonio fit data/iso_plastic`'
    verify:
    - Roughness within 10 % of the in-plane fit (M24.2) for the same swatch.
    fail:
    - 'Very different: check M2 zero (M25.4) — a tilt offset biases out-of-plane rows.'
    record: Both fits in phases/08-tilt/design.md → Results; commit.
- id: M27
  stage: 09-spin
  title: Spin wired and homed
  goal: Sample spins on its own axis (direct drive).
  weeks: 1
  steps:
  - id: M27.1
    title: Wire the spin motor
    time: 30 min
    needs:
    - CTL-11 cable
    - SPN-04 endstop
    - TBL-07b flag
    - CTL-06 leads
    - jumpers
    do:
    - Spin motor cable into the E4 E0 socket (route it along the yoke arm with slack for ±90° tilt and ±180° table).
    - Flag on the platter rim (2 × M3 × 8), endstop on the cradle.
    - 'Endstop lead to TH0 (2-pin: signal + ground, no supply): S and G from TH0 via a 2-pin XH lead; the module''s V from Pico 3V3 OUT (pin 36) via a lead whose XH housing slides over Pico pins 36–37 with
      only pin 36 populated. Pico GND is already tied to the E4 (M09.2 ground jumper).'
    verify:
    - Platter turns 360° by hand with the motor unpowered; face runout < 0.3 mm at 40 mm radius.
    - '`?` shows `Pn:A` with the flag in the slot.'
    fail:
    - 'No `Pn:A`: module V missing (3V3 lead) or the Pico not powered.'
    record: Tick the boxes; `make done id=M27.1`.
  - id: M27.2
    title: Home and repeat
    time: 45 min
    needs:
    - laser + mirror
    do:
    - '`installed_phase: 9`; `opengonio home`.'
    - 'Mirror on the platter: `opengonio repeat M1 --at 0 --away 90 --n 20`.'
    verify:
    - '`"pass": true`.'
    record: JSON in phases/09-spin/design.md → Results; commit.
- id: M28
  stage: 09-spin
  title: Anisotropic material measured
  goal: 'Brushed metal: highlight depends on direction.'
  weeks: 1
  steps:
  - id: M28.1
    title: Spin sweep
    time: 30 min
    needs:
    - brushed aluminium swatch
    - tape arrow on the brushing direction
    do:
    - Clamp the swatch, arrow at M1 = 0.
    - '`opengonio capture spin --theta 30 --step 15 --out data/spin_brushed`'
    - '`opengonio curve data/spin_brushed`'
    verify:
    - '`centre_mean` max ÷ min ≥ 2 across M1 (curve.csv).'
    - Brightest when the arrow is vertical, i.e. grooves perpendicular to the light–camera plane (note that M1).
    fail:
    - '< 2×: swatch not brushed enough, or polished; try a different piece.'
    record: Max/min ratio and brightest M1 in phases/09-spin/design.md → Results.
  - id: M28.2
    title: Anisotropic set
    time: 10 min
    wait: ~1.5 h unattended
    needs:
    - same swatch
    do:
    - '`opengonio capture anisotropic --step 15 --phi-step 30 --out data/aniso_brushed`'
    - '`opengonio verify data/aniso_brushed`'
    verify:
    - PASS, or WARN with only `saturated` ≤ 5 % of shots.
    record: Tick the boxes; `make done id=M28.2`.
  - id: M28.3
    title: Why it needs 4 angles
    time: 15 min
    needs:
    - M28.2
    - M26.3 plastic fit
    do:
    - '`opengonio curve data/aniso_brushed && opengonio fit data/aniso_brushed`'
    verify:
    - '`rms_pct_of_peak` for brushed ≥ 2 × the plastic''s (an isotropic model can''t fit it).'
    record: Both RMS values in design.md; commit.
- id: M29
  stage: 10-color
  title: Spectral sensor (optional kit)
  goal: Colour spectrum of the spot at the zero point; camera stays for images.
  weeks: 1
  steps:
  - id: M29.1
    title: Mount
    time: 30 min
    wait: print 1 h
    needs:
    - SPC-01 AS7341
    - SPC-03 print
    - 2 × M2.5 screws
    do:
    - Print `SPC-03a_spectral_tube.stl`; screw the AS7341 to it.
    - Clamp it on the camera pillar just above the camera (M5 × 10 into the z 181 pilot); aim at the zero point.
    verify:
    - 'Looking down the tube: the zero point is centred.'
    record: Tick the boxes; `make done id=M29.1`.
  - id: M29.2
    title: Wire and read
    time: 20 min
    needs:
    - SPC-02 cable
    do:
    - SDA → Pico GP16, SCL → GP17, VIN → 3V3, GND → GND (same bus as the OLED).
    - '`bash scripts/pico.sh`; `python -m serial.tools.miniterm /dev/ttyACM0 115200`; type `SPEC?`.'
    verify:
    - Reply `SPEC` + 10 numbers; covering the tube drops all to < 5 % of uncovered.
    fail:
    - '`ERR`: SDA/SCL swapped, or no 3V3.'
    record: Wiring check in phases/10-color/design.md → Results.
  - id: M29.3
    title: Aim angle
    time: 10 min
    needs:
    - ruler
    do:
    - Measure the tube axis height h above the camera axis (mm).
    - Set `spectral.elevation_deg` = atan(h / 350) in `machine.yaml`.
    verify:
    - '`make test` passes.'
    record: h and the angle in design.md.
  - id: M29.4
    title: Spectral curves
    time: 45 min
    needs:
    - PTFE
    - red paper
    - blue paper
    do:
    - '`opengonio capture inplane --step 10 --spectral --out data/ptfe_spec`; same for `red_spec`, `blue_spec`.'
    - '`opengonio curve data/ptfe_spec data/red_spec data/blue_spec`'
    verify:
    - 'PTFE repeated twice: F1–F8 within 3 %.'
    - Red ÷ PTFE highest in F7–F8; blue ÷ PTFE highest in F2–F3.
    record: Ratios in design.md; commit.
- id: M30
  stage: 10-color
  title: LED bank and polarizers (optional kit)
  goal: '8 colour bands for images; shine separated from colour. Built it: set `lights.multispectral.built: true`; without it scans leave out the photometric set.'
  weeks: 2
  steps:
  - id: M30.1
    title: Print and fit LEDs
    time: 2 h
    wait: print 3 h
    needs:
    - MSK-01 LEDs
    - MSK-04 heatsink
    - MSK-06 prints
    do:
    - Print `MSK-06a_led_ring.stl`, `MSK-06b_led_mast.stl`.
    - 7 pre-wired LED stars in slots 1–7 of the ring (slot 8 spare), thermal pad, wavelength written next to each.
    verify:
    - Ring on the mast at 40° elevation (angle gauge).
    record: Tick the boxes; `make done id=M30.1`.
  - id: M30.2
    title: Driver wiring
    time: 1 h
    needs:
    - MSK-02 driver
    - MSK-03 ULN2803A
    do:
    - ULN2803A into the breadboard. LED − leads → its outputs (lever connector to a cut jumper each); inputs ← Pico GP8–15 (jumpers); driver supply switched by `M62 P1`.
    verify:
    - 'Continuity: each GP pin → its ULN input; each output → one LED cathode.'
    record: Tick the boxes; `make done id=M30.2`.
  - id: M30.3
    title: Band test
    time: 15 min
    needs:
    - '`installed_phase: 10`'
    - '`lights.multispectral.built: true`'
    do:
    - 'Hub: `BAND 0` … `BAND 7`, then `BAND OFF`.'
    - '`opengonio check-pose M4=60 M3=30`'
    verify:
    - Exactly one LED per command.
    - '`"safe": true` with the mast fitted.'
    record: Band → wavelength table in phases/10-color/design.md → Results.
  - id: M30.4
    title: Polarizers
    time: 30 min
    needs:
    - MSK-05 film
    - mirror
    do:
    - Film in the lamp slot; film disc on the lens.
    - Mirror at the specular pose; turn the lens disc to the darkest image, then 90°.
    verify:
    - Crossed ÷ parallel brightness ≤ 1/20.
    record: Both values in design.md; commit.
- id: M31
  stage: 11-scan-capture
  title: Scan hardware
  goal: Scan camera fixed at 650 mm, object held securely; nothing on the measuring side moves.
  weeks: 1
  steps:
  - id: M31.1
    title: Print risers and scan plate
    time: 10 min
    wait: print 3 h
    needs:
    - SCN-03 prints
    do:
    - Print `SCN-03a/b/c` risers, `SCN-03d_scan_camera_plate_15.stl` and a second `CAM-03a_aperture_stop_f8.stl`.
    verify:
    - Risers sit flat on the platter.
    - 'Scan plate: its face leans 15° to its clamp channel (phone level app: 75° on the face with the channel vertical).'
    record: Tick the boxes; `make done id=M31.1`.
  - id: M31.2
    title: Mount the scan camera
    time: 45 min
    needs:
    - scan post at x = 674.4 (M12.2)
    - 4 × M2.5 × 8 (CAM-08, or the CAM-07 screws moving with the camera)
    - CAM-04 camera + CAM-05 lens (optional kit), or the measuring camera moved here
    do:
    - The scan post stands on the outrigger at x = 674.4 mm since M12.2 (lens 650 mm from the zero point, 15° down).
    - 'Camera board on the scan plate''s standoffs (4 × M2.5 × 8); plate on the post: lens centre 168 mm above the zero point (318 mm above the board), looking 15° down.'
    - Focus on the zero point (M17.3 method) and lock the lens; aperture stop on.
    - Plug it in; `machine.yaml` → `scan.camera_index` = its index (usually 1); `opengonio scan plan`.
    verify:
    - '`scan plan` prints `two_cameras: true` and both clearances > 0.'
    - 'Scan camera image: zero point within ±15 px of centre; the measuring camera is not in the picture.'
    - 1 mm grid resolved at the zero point.
    fail:
    - 'Measuring camera visible at the bottom edge: raise the scan camera (bigger `scan.camera_elevation_deg`, re-check with `scan plan`).'
    - 'One-camera option (no CAM-04/05): move the measuring camera to this post, refocus, set `scan.camera_index` = `camera.index`; move it back and redo M17.3–M17.5 before measuring BRDFs.'
    record: Index, height and the clearance numbers in phases/11-scan-capture/design.md → Results.
  - id: M31.3
    title: Putty hold (S3)
    time: 20 min
    needs:
    - SCN-01 putty
    - 100 g object
    - SCN-02 ChArUco mat
    do:
    - Object on the riser with putty; `opengonio move M2=80`; spin `M1` three turns (`opengonio move M1=180` … `-180`).
    verify:
    - Mat corners move ≤ 1 px between turn 1 and turn 3.
    record: S3 in `phases/11-scan-capture/test.csv`.
- id: M32
  stage: 11-scan-capture
  title: Camera position calibrated
  goal: Every photo's pose known to 0.3 mm.
