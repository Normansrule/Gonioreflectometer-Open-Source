# Single source for stages and milestones. `python tools/roadmap.py` writes phases/*/README.md and the README;
# `--github --repo OWNER/NAME` makes one GitHub milestone per milestone and one issue per step (Do / Verify / Record).
# Edit freely, or use tools/new.py; then run `make`.
stages:
- folder: 00-plan
  title: Plan
  safety: 'ABS gives off fumes (styrene) while printing: enclosed printer, door shut, in a ventilated room you don''t sleep in; open the door only after it cools.'
- folder: 01-power
  title: Power box
  safety: Mains stays inside the certified adapter. Plug in with the e-stop pressed; unplug before touching any screw terminal.
- folder: 02-controller
  title: Controller and buttons
  safety: Never plug or unplug motors with 24 V on.
- folder: 03-frame
  title: Frame
- folder: 04-light-arm
  title: Light arm (M4)
- folder: 05-table
  title: Table (M3)
- folder: 06-camera-light
  title: Camera and light
  safety: Don't stare into the lamp.
- folder: 07-calibrate
  title: Calibrate → game material
- folder: 08-tilt
  title: Tilt (M2)
- folder: 09-spin
  title: Spin (M1)
- folder: 10-color
  title: Colour add-ons (optional)
- folder: 11-scan-capture
  title: '3D scan: capture'
- folder: 12-scan-mesh
  title: '3D scan: mesh'
- folder: 13-object-material
  title: Material on the 3D model
- folder: 14-laptop-app
  title: Laptop app
- folder: 15-standalone
  title: Standalone (no laptop)
- folder: 16-release
  title: Release
- folder: 17-upgrades
  title: Upgrades (optional)
milestones:
- id: M01
  stage: 00-plan
  title: Read and decide
  goal: Know what you are building, why, and what to buy.
  weeks: 1
  steps:
  - id: M01.1
    title: Get the papers
    time: 20 min
    needs:
    - laptop with Ubuntu (WSL)
    - browser
    do:
    - '`bash scripts/get_papers.sh`'
    - 'For each line under *Blocked for scripts*: open it in your browser, save the PDF to Downloads.'
    - '`bash scripts/get_papers.sh --from /mnt/c/Users/<you>/Downloads`'
    verify:
    - Second run prints only `have` / `took` lines and no *Blocked* list.
    - '`ls papers/open | grep R1` shows the R1 PDF.'
    fail:
    - '`took` missing for a file: the saved name differs; check `papers/papers.tsv` → `browser_name`.'
    - 'PDF opens as an HTML page: the publisher served a login page; download again from the article page.'
    record: Nothing to record. Tick the boxes; `make done id=M01.1`.
  - id: M01.2
    title: Read R1
    time: 2 h
    needs:
    - papers/open/R1_*.pdf
    do:
    - Read R1 sections 2 (device), 3 (calibration), 4 (results).
    - 'Close the paper. In `phases/00-plan/design.md` → Results, answer in one line each: (1) which axes turn the sample, (2) why the camera never moves, (3) what the mirror test calibrates, (4) why a 5°
      minimum light–camera angle.'
    verify:
    - Your four answers match README → *The machine* and *Theory and equations* (open them only now).
    fail:
    - 'An answer is wrong: re-read that part of R1 section 2 or 3 and correct the line.'
    record: The four answers in phases/00-plan/design.md → Results; commit.
  - id: M01.3
    title: Explore the simulator
    time: 30 min
    needs:
    - docs/index.html in a browser
    do:
    - Open `docs/index.html`. Drag to orbit; scroll to zoom; double-click to reset.
    - Press ▶ Demo. Drag *Build stage* from 1 to 17 and watch parts appear.
    - Set M4 = 60, M3 = 30. Then M4 = 60, M3 = 25.
    - 'Calibration lab: hidden table error +0.8°; press *Run calibrate mirror*; then drag *lamp drift* to 0.2 %.'
    verify:
    - M4 60 / M3 30 shows *Specular geometry ✓*; M3 25 does not.
    - 'Calibration lab: −0.80° WARN before, 0.00° PASS after calibrate; drift 0.2 % → FAIL.'
    - 'Without notes, sketch the machine: M1–M4, light, camera, zero point.'
    fail:
    - 'Page blank: open it with Chrome or Firefox (not a preview pane).'
    record: 'Optional: sketch photo as `phases/00-plan/sketch.jpg`. Tick the boxes; `make done id=M01.3`.'
  - id: M01.4
    title: Decide the parts
    time: 45 min
    needs:
    - '`PARTS.md` (on GitHub: open it → ✏️)'
    do:
    - Read each part's *why* line in `PARTS.md`.
    - 'Tick `[x]` the parts you agree with; `status: have` for ones you own; `status: swap` + `note:` for ones you want changed; `status: skip` for ones you won''t use.'
    - 'Tools: tick the TLS rows (00 · Plan) you will buy (they have their own total); `have` only for ones you really own. Optional kits: tick the SPC rows (spectral, +$17), MSK rows (colour bands + polarizers,
      +$30), CAM-04/05 (second camera: no camera moves, +$81), CAL-03 (chrome balls, +$10), ENC-01/03 (drape, only if M21.2 fails) and STA rows (standalone, +$38) only if you want them.'
    - Commit (*Commit changes* on GitHub, or `make publish m="M01.4 parts decided"` locally).
    verify:
    - Stages 01–03 headings in `PARTS.md` read `N/N decided` (nothing left `suggested`).
    - 'Summary table: *Still to buy* core ≤ the cap (`HARD_CAP` in `tools/bom_check.py`, $630); `make check` prints four `OK`.'
    fail:
    - 'A line stays `suggested` after ticking: the box must read `[x]` with no space inside.'
    - '`swap` parts: tell me the replacement, or add it with `python tools/new.py part …`, then `skip` the old one.'
    record: '`PARTS.md` committed. Tick the boxes; `make done id=M01.4`.'
- id: M02
  stage: 00-plan
  title: Software runs on the laptop
  goal: Tests, dry runs and the simulated machine work before any hardware.
  weeks: 1
  steps:
  - id: M02.1
    title: Install
    time: 20 min
    needs:
    - laptop
    - internet
    do:
    - 'In the repo folder: `make setup` (once).'
    - '`source .venv/bin/activate` (every new terminal).'
    - '`make all`'
    verify:
    - '`make all` ends with `passed` and no `failed`, after four `OK` lines from the check.'
    fail:
    - '`python3-venv` missing: `sudo apt install -y python3-venv`, then `make setup`.'
    - '`ERR` lines: each names a file; `make build` then `make check` again.'
    record: Tick the boxes; `make done id=M02.1`.
  - id: M02.2
    title: Dry run
    time: 10 min
    needs:
    - M02.1
    do:
    - '`opengonio check-pose M4=60 M3=30`'
    - '`opengonio --dry-run move M4=80 M3=25`'
    - '`opengonio check-pose M4=10 M3=0`'
    verify:
    - 'First: `"safe": true`, `theta_i` = `theta_r` = 30.0.'
    - Second prints `G53 G1 X80.0000 Y25.0000 F600`.
    - 'Third: `"safe": false` (light would hit the camera) and exit code 2.'
    fail:
    - '`command not found`: run `source .venv/bin/activate` first.'
    record: Tick the boxes; `make done id=M02.2`.
  - id: M02.3
    title: Simulated machine
    time: 20 min
    needs:
    - M02.1
    do:
    - '`make sim`'
    - '`opengonio --cal data/sim/try.yaml --sim mirror --sim-error M3=0.8 capture mirror --theta 30 --out data/sim/a`'
    - '`opengonio --cal data/sim/try.yaml verify data/sim/a`; `opengonio --cal data/sim/try.yaml curve data/sim/a`'
    - Open `data/sim/a/curve.svg` in a browser.
    - '`opengonio --cal data/sim/try.yaml calibrate mirror data/sim/a`'
    - Capture again with `--out data/sim/b` (same `--sim-error`), then verify `data/sim/b`.
    verify:
    - '`make sim` ends with `"result": "ALL PASS"`.'
    - 'First verify: `mirror_peak_error_deg` = −0.8, `result` WARN; the chart peak sits left of the orange line.'
    - 'Second verify: `mirror_peak_error_deg` within ±0.1, `result` PASS.'
    fail:
    - '`ALL PASS` missing: `data/sim/summary.json` → `checks` shows which one is false; run `make test`.'
    record: Nothing to commit (`data/sim/` is ignored). Tick the boxes; `make done id=M02.3`.
  - id: M02.4
    title: Practice a full measurement
    time: 30 min
    needs:
    - M02.3
    do:
    - '`C="--cal data/sim/p.yaml"; G="--sim-gamma 2.2"`'
    - '`opengonio $C --sim ptfe $G capture dark --out data/sim/dark && opengonio $C calibrate dark data/sim/dark`'
    - '`opengonio $C --sim ptfe $G capture linearity --out data/sim/lin && opengonio $C calibrate linearity data/sim/lin`'
    - '`opengonio $C --sim ptfe $G capture white --out data/sim/white && opengonio $C calibrate white data/sim/white`'
    - '`opengonio $C --sim plastic $G capture inplane --step 10 --out data/sim/plastic`'
    - '`opengonio $C curve data/sim/plastic && opengonio $C fit data/sim/plastic`; open `fit.svg`.'
    verify:
    - '`calibrate linearity` prints `gamma` 2.2 ± 0.1.'
    - '`fit` prints base_color 0.20 ± 0.02, roughness 0.30 ± 0.02, metallic ≤ 0.05 (the simulated plastic).'
    - In `fit.svg` the lines pass through the dots.
    fail:
    - '`brdf_per_sr` blank / fit error: a calibrate step was skipped; `opengonio $C calibrate show` lists what is missing.'
    record: This is exactly stage 07 on real hardware. Tick the boxes; `make done id=M02.4`.
- id: M03
  stage: 00-plan
  title: CAD and printer ready
  goal: Printed parts fit first time.
  weeks: 1
  steps:
  - id: M03.1
    title: Order the printer, filament and first tools
    time: 30 min
    wait: shipping 3–10 days
    needs:
    - '`PARTS.md` → 00 · Plan'
    do:
    - Order TLS-01 (enclosed printer for ABS), FIL-01 (black ABS 1 kg), TLS-03 hex keys, TLS-06 calipers, plus FRM-06 (M3/M4/M5 screws) and FRM-08 (608 bearings) for the fit test; set them `ordered` with
      `paid:` in `PARTS.md`.
    - No printer? Skip TLS-01 and send the STL files to a print service or makerspace in black ABS; tell them the settings in M03.3.
    verify:
    - '`python tools/bom_check.py` shows the tools total; TLS-01, FIL-01, TLS-03, TLS-06, FRM-06, FRM-08 are `ordered`.'
    record: Commit the dated BOM.
  - id: M03.2
    title: Onshape document
    time: 30 min
    needs:
    - free Onshape account
    do:
    - Create document **OpenGonio**; add Variable Studio `OG globals` with the values in `phases/00-plan/design.md` → Onshape set-up.
    - Insert → Import `phases/00-plan/3d/PLAN-01_tolerance_coupon.step`.
    - 'Import `cad/assembly/opengonio_assembly.step` (whole machine, every part has a model; `cad/README.md` lists them). Real vendor models: `bash scripts/get_cad.sh` → `cad/vendor/`.'
    verify:
    - 'Coupon imports as one solid (Parts list: 1 part, not a mesh).'
    - The assembly opens with the plywood, lazy Susan, arm, table and both cameras in place.
    fail:
    - 'Imported as a mesh: you picked the .stl; import the .step.'
    record: Onshape link under Onshape set-up in `phases/00-plan/design.md`; commit.
  - id: M03.3
    title: Print the coupon
    time: 15 min
    wait: print 1.5 h
    needs:
    - TLS-01 enclosed printer
    - FIL-01 black ABS
    - a ventilated room
    do:
    - 'Slice `phases/00-plan/3d/PLAN-01_tolerance_coupon.stl`: ABS, nozzle 250 °C, bed 100 °C, door closed, fan ≤ 20 %, 0.2 mm layers, 4 walls, 25 % infill, no supports.'
    - Print; let it cool in the closed printer for 10 min (ABS warps if cooled fast).
    verify:
    - 'Corners flat on the bed (no lifting); holes round; calipers: coupon length 100.0 ± 0.3 mm.'
    fail:
    - 'Short (ABS shrinks ~0.5–0.8 %): set the slicer''s XY shrinkage compensation to 100 × 100 / measured length %, reprint.'
    - 'Corners lift: clean the bed, add a 5 mm brim, keep the door shut.'
    - 'Bottom flare: elephant-foot compensation 0.2 mm.'
    record: Tick the boxes; `make done id=M03.3`.
  - id: M03.4
    title: Set clearances
    time: 30 min
    needs:
    - 5 × M3 × 10 from FRM-06
    - FRM-08 608 bearings (3)
    - TLS-03 hex key 2.5 mm
    - TLS-06 calipers
    do:
    - Drive one M3 × 10 into each of the 5 holes (2.5 → 2.9 mm) with the hex key, slowly, until the head touches; back it out.
    - Push a 608 into each of the 3 pockets by thumb.
    - Pick the smallest hole where the screw goes all the way without splitting the coupon and holds when you pull on it → `M3_TAP` = that hole Ø.
    - Pick the pocket where the 608 presses in and does not fall out upside down → `CLEAR` = pocket Ø − 22.0.
    - Set both at the top of `tools/cad/parts.py`.
    - 'Once: `.venv/bin/pip install cadquery numpy-stl matplotlib`; then `make parts`.'
    verify:
    - '`git status` lists changed `.step` / `.stl` files in `phases/*/3d/`.'
    - '`make check` prints four `OK`.'
    fail:
    - 'Every screw spins loose: print 10 °C hotter (better layer bonding) and reprint the coupon.'
    - '`make parts` import error: the cadquery install failed; re-run the pip line and read its last error.'
    record: 'Commit: `make publish m="M03.4 clearances set"`.'
- id: M04
  stage: 01-power
  title: Order power parts
  goal: Everything for the power box on the bench.
  weeks: 2
  steps:
  - id: M04.1
    title: Order
    time: 30 min
    wait: shipping 3–10 days
    needs:
    - '`PARTS.md` → 01 · Power box'
    - FRM-06 screws (03 · Frame)
    - '`PARTS.md` → 00 · Tools'
    do:
    - Order every stage-01 part ticked `[x]` (status `agreed`), using its link.
    - FRM-06 screws were ordered in M03.1; the box uses them.
    - 'Tools: order the TLS rows (00 · Plan; their own total, not in the machine total): multimeter (TLS-05) and wire stripper (TLS-04) are needed now; the printer and ABS were ordered in M03.1.'
    - 'In `PARTS.md` set each ordered part to `status: ordered` and fill `paid:`.'
    verify:
    - Stage 01 in `PARTS.md` has no `agreed` or `suggested` parts left; *Paid so far* went up.
    - Tools TLS-02 to TLS-06 are `have` or `ordered`.
    fail:
    - 'Part out of stock: its *Must meet* line says what a substitute needs; set `swap` + `note:`, or add one with `python tools/new.py part …`.'
    record: Commit the dated BOM.
  - id: M04.2
    title: Print the box
    time: 15 min
    wait: print 5 h
    needs:
    - FIL-01 ABS
    - TLS-01 enclosed printer
    do:
    - 'Print `phases/01-power/3d/PWR-18a_power_box.stl` and `PWR-18b_power_lid.stl`: ABS (settings from M03.3, brim on), 0.2 mm, 4 walls, 30 % infill.'
    verify:
    - Walls not split; the Ø22.3 e-stop hole in the lid is round (calipers 22.2–22.5 mm).
    fail:
    - 'Hole too small: scale the lid XY by +1 % in the slicer and reprint (no drilling).'
    record: Tick the boxes; `make done id=M04.2`.
  - id: M04.3
    title: Check parts
    time: 20 min
    needs:
    - all PWR parts
    - printed box + lid
    do:
    - Lay all parts out; check each against its *Must meet* line in `PARTS.md` (value, rating).
    - 'Dry-fit: DC jack adapter PWR-03 in the slot of the +X wall; e-stop PWR-13 in the lid.'
    verify:
    - Fuse PWR-05 marked 3.15 A **T** (time-lag), 2 pieces.
    - E-stop has an NC contact block with screw terminals.
    - Each part fits its hole without forcing.
    fail:
    - 'Wrong part: return it now; don''t substitute ratings (fuse 3.15 A T, e-stop NC ≥ 3 A at 24 V DC).'
    record: '`status: have` per part in `PARTS.md` as it arrives; commit.'
- id: M05
  stage: 01-power
  title: Wire the power box
  goal: Fuse and e-stop wired with screw terminals only; nothing soldered; not powered yet.
  weeks: 1
  steps:
  - id: M05.1
    title: Box hardware
    time: 20 min
    needs:
    - PWR-18 box + lid
    - PWR-03 jack adapter
    - PWR-13 e-stop
    - 4 × M3 × 10
    - TLS-02 / TLS-03
    do:
    - Drive the 4 M3 × 10 into the box posts once and back out (cuts the threads).
    - 'DC jack adapter (PWR-03) into the +X wall slot: barrel facing out, screw block inside.'
    - E-stop (PWR-13) through the lid hole, ring nut tight; NC contact block on its back (marked NC, usually red, terminals 1–2).
    verify:
    - 'Twisting each part by hand: nothing rotates.'
    - Lid closes on 4 × M3 × 10 with no gap.
    fail:
    - 'Lid screw spins: that post''s hole is too big; reprint the box with a smaller `M3_TAP`.'
    record: Tick the boxes; `make done id=M05.1`.
  - id: M05.2
    title: Main wiring
    time: 45 min
    needs:
    - PWR-04 fuse holder + PWR-05 fuse
    - PWR-15 18 AWG pair (1 m)
    - TLS-04 stripper
    - TLS-02 flat screwdriver
    do:
    - Strip 8 mm, twist the strands tight.
    - Jack `+` terminal → fuse holder lead A. Fuse holder lead B → e-stop NC terminal 1.
    - E-stop NC terminal 2 → the whole red wire, out through the J3 slot (it will later pass through the over-travel switch, M14.1, on its way to the E4).
    - Jack `−` terminal → the whole black wire, out through the −X slot. Leave both ends free; zip-tie the pair to the box.
    - 'Tug every wire: none slips out.'
    verify:
    - 'Continuity beeps along each row of the netlist (`phases/01-power/design.md`): jack + … red end, jack − … black end.'
    - No beep red out ↔ black out.
    fail:
    - 'No beep through the e-stop: you used the NO block; move the wires to NC.'
    - 'Wire pulls out: strip longer, twist, re-tighten.'
    record: Tick each row on the printed netlist. Tick the boxes; `make done id=M05.2`.
  - id: M05.3
    title: Checks with power off
    time: 10 min
    needs:
    - TLS-05 multimeter
    - adapter unplugged
    - e-stop released
    do:
    - 'Ω range: red out to black out (T1).'
    - 'Ω range: across the fuse holder leads with the fuse in (T2).'
    verify:
    - T1 > 10 kΩ (or OL).
    - T2 < 1 Ω.
    fail:
    - 'T1 low: a stray strand bridges + and − at the jack screws; re-strip and re-tighten.'
    - 'T2 OL: fuse blown or not seated; fit the spare.'
    record: T1, T2 in `phases/01-power/test.csv` (date, value, PASS/FAIL).
- id: M06
  stage: 01-power
  title: First power-on
  goal: Safe 24 V that the e-stop cuts.
  weeks: 1
  steps:
  - id: M06.1
    title: First 24 V and polarity
    time: 15 min
    needs:
    - PWR-01 adapter
    - PWR-02 cord
    - TLS-05 multimeter
    do:
    - E-stop pressed. Plug the adapter into the jack, then into the wall.
    - 'Release the e-stop; DC V: black probe on black out, red probe on red out (T3).'
    verify:
    - 'T3 = +23.5 to +24.5 V (a plus sign: polarity right).'
    - No smell, nothing warm after 1 min.
    fail:
    - 'Reads −24 V: jack + / − swapped; unplug, swap the two wires at the jack screws.'
    - '0 V: fuse (check T2), e-stop pressed, or the J3 loop open.'
    record: T3 in `test.csv`.
  - id: M06.2
    title: E-stop and unplug
    time: 10 min
    needs:
    - TLS-05 multimeter
    do:
    - Press the e-stop; read the out leads after 1 s (T5). Release.
    - 'Pull the adapter from the wall; read after 2 s (T6). (No rocker: off = e-stop pressed or unplugged.)'
    verify:
    - T5 < 1 V within 1 s.
    - T6 < 0.5 V within 2 s.
    fail:
    - 'Stays high on e-stop: J3 loop bypassed or NC/NO swapped.'
    record: T5, T6 in `test.csv`.
  - id: M06.3
    title: Heat
    time: 15 min
    wait: 30 min soak
    needs:
    - TLS-05 temperature probe
    - 'optional: plug-in power meter'
    do:
    - Check the fitted fuse and the spare (T8).
    - Lid closed, 30 min on; temperature probe through the J3 slot into the box air (T9).
    - 'Optional: wall power meter, nothing on the out leads: read watts (T10).'
    verify:
    - T8 3.15 A T fitted + spare.
    - T9 ≤ 45 °C.
    - T10 ≤ 3 W (if measured).
    fail:
    - 'T9 high: a loose screw terminal heats up; feel each one, re-tighten.'
    record: T8–T10 in `test.csv`; label the box *24 V*; commit.
- id: M07
  stage: 02-controller
  title: Order controller parts
  goal: E4, Pico H, keypads, one motor and one endstop on the bench.
  weeks: 2
  steps:
  - id: M07.1
    title: Order
    time: 30 min
    wait: shipping 3–10 days
    needs:
    - '`PARTS.md` → 02 · Controller and buttons'
    do:
    - Order every stage-02 part ticked `[x]`.
    - Also order LAR-02 (one NEMA 17) and LAR-05 (one TCST2103 endstop) from stage 04 for bench tests.
    - 'Set them `status: ordered` with `paid:` in `PARTS.md`.'
    verify:
    - Stage 02 has no `agreed` or `suggested` parts left.
    fail:
    - 'E4 sold out: its *Must meet* line names what a replacement needs; its pins differ — update `firmware/fluidnc/config.yaml`.'
    record: Commit the dated BOM.
  - id: M07.2
    title: Unpack and check
    time: 10 min
    needs:
    - CTL parts
    - PWR-19 breadboard
    - PWR-10 PC817
    - PWR-11 10 k
    do:
    - 'Pico H: both 20-pin headers fitted. Keypads: 5-wire tails intact. Jumpers: male–female.'
    - 'Find each keypad''s common pin: meter on continuity, one probe on a tail pin, press keys; the common pin beeps with every key.'
    verify:
    - Common pin found on both keypads (write it on the tail with a marker).
    fail:
    - 'No pin beeps with all keys: tail not fully seated in the meter probe; use a jumper''s male end as a probe tip.'
    record: '`status: have` per arrived part in `PARTS.md`; commit.'
- id: M08
  stage: 02-controller
  title: One motor turns from the laptop
  goal: Laptop → E4 → motor works on the bench.
  weeks: 1
  steps:
  - id: M08.1
    title: USB into Ubuntu
    time: 15 min
    needs:
    - CTL-01 E4
    - CTL-03 USB cable
    - Windows PowerShell (admin)
    do:
    - Plug the E4 into the laptop by USB (no 24 V needed).
    - 'PowerShell (admin): `usbipd list`; `usbipd bind --busid <E4 busid>`; `usbipd attach --wsl --busid <E4 busid>`.'
    - 'Ubuntu: `sudo usermod -aG dialout $USER && newgrp dialout`; `ls /dev/ttyUSB*`.'
    verify:
    - '`ls` prints `/dev/ttyUSB0`.'
    fail:
    - 'Not listed in `usbipd list`: charge-only cable; swap it.'
    - 'Vanishes after replug: run `usbipd attach` again (needed after every replug).'
    record: Tick the boxes; `make done id=M08.1`.
  - id: M08.2
    title: Flash FluidNC
    time: 20 min
    needs:
    - M08.1
    do:
    - '`bash scripts/e4.sh flash`; close its terminal with Ctrl+].'
    - '`bash scripts/e4.sh wifi "SSID" "PASSWORD"`; press E4 reset.'
    - '`bash scripts/e4.sh config fluidnc.local`; press E4 reset.'
    verify:
    - '`opengonio send ''$I''` lists `FluidNC`.'
    - '`opengonio send ''?''` prints a line starting `<Idle|MPos:` (or `<Alarm` before homing).'
    fail:
    - '`fluidnc.local` not found: use the IP the E4 prints on boot, or join hotspot FluidNC / 12345678 and use 192.168.0.1.'
    record: C1 (USB) in `phases/02-controller/test.csv`.
  - id: M08.3
    title: Bench motor
    time: 20 min
    needs:
    - LAR-02 motor
    - power box
    - tape flag on the shaft
    do:
    - Adapter unplugged. Red out → E4 VIN `+`, black out → E4 VIN `−` (screw terminal). Motor → E4 X socket. Plug in, e-stop released.
    - '`opengonio send ''G91'' ''G1 X10 F600'' ''G1 X-10 F600'' ''G90''`'
    - '`opengonio send ''G91'' ''G1 X360 F300'' ''G90''`; press the e-stop halfway.'
    verify:
    - Shaft turns, then returns to the tape mark.
    - E-stop stops it at once; after release `opengonio send '?'` shows `Alarm` (must re-home).
    fail:
    - 'Motor buzzes, no turn: coil pairs crossed; swap the middle two wires of its plug.'
    - 'Wrong direction: flip `direction_pin` in `firmware/fluidnc/config.yaml`, `bash scripts/e4.sh config`.'
    record: Note the result under C7 in `test.csv`.
- id: M09
  stage: 02-controller
  title: Keypads work with the laptop
  goal: Membrane keys drive the machine.
  weeks: 1
  steps:
  - id: M09.1
    title: Hub firmware
    time: 15 min
    needs:
    - CTL-02 Pico H
    - CTL-04 USB cable
    do:
    - Hold BOOTSEL, plug the Pico in, copy the MicroPython .uf2 onto `RPI-RP2`.
    - 'WSL: `usbipd attach` the Pico too.'
    - '`bash scripts/pico.sh`'
    verify:
    - '`pico.sh` prints `PONG OpenGonio-hub 2`.'
    fail:
    - '`mpremote` can''t find it: `ls /dev/ttyACM*` empty → attach with usbipd again.'
    record: C4 (PING part) in `test.csv`.
  - id: M09.2
    title: Wire the keypads
    time: 30 min
    needs:
    - 2 × CTL-05 keypads
    - CTL-07 jumpers
    - pin table in `phases/02-controller/design.md`
    do:
    - 'Keypad A: male jumper ends into its tail; common → Pico GND; keys 1–4 → GP2 HOME, GP3 START, GP4 STOP, GP5 LIGHT.'
    - 'Keypad B: common → GND; key 1 → GP6 NEXT.'
    - 'Common ground (always): one jumper from the E4 TH1 ground pin to Pico GND: the M1 endstop (M27.1) and PAUSE need it without the laptop.'
    - 'Optional PAUSE: keypad B key 2 → E4 GPIO39 (TH1 signal pin).'
    - '`python -m serial.tools.miniterm /dev/ttyACM0 115200`, press each key.'
    verify:
    - Each press prints its own `BTN <NAME>` exactly once.
    fail:
    - 'Nothing on any key: common on a key pin; redo M07.2.'
    - 'Two lines per press: the firmware debounces 30 ms — reseat the jumper on that pin.'
    record: C4 in `test.csv`.
  - id: M09.3
    title: Panel drives the motor
    time: 20 min
    needs:
    - bench motor on X
    do:
    - '`opengonio panel`'
    - Press HOME, LIGHT, NEXT, START, then STOP.
    - 'Optional PAUSE: start again; press PAUSE during a move; then `opengonio send ''~''`.'
    verify:
    - Each press prints its action in the panel log.
    - PAUSE (if wired) freezes the shaft even with the laptop unplugged; `~` resumes.
    fail:
    - 'PAUSE does nothing: GPIO39 pin wrong in config; check the pin table.'
    record: C5, C6 in `test.csv` (C6 `n/a` if PAUSE not wired).
- id: M10
  stage: 02-controller
  title: Controller box closed
  goal: Boards boxed; links, homing, e-stop sense and heat tested.
  weeks: 1
  steps:
  - id: M10.1
    title: Print and mount
    time: 30 min
    wait: print 4 h
    needs:
    - CTL-10 prints
    - 4 × M3 × 8
    - PWR-19 breadboard
    do:
    - Print `CTL-10a_button_panel.stl`, `CTL-10b_controller_tray.stl`.
    - Drive M3 × 8 into the 4 E4 standoffs once; mount the E4 (holes 83.6 × 60.6 mm). Turn the Pico H components-down (header pins up) and press its corner holes over the tray pegs (it was flashed in M09.1).
    - 'Breadboard: peel its backing, stick it in the recess. Keypads: peel and stick into the panel recesses, tails through the slots.'
    verify:
    - E4 sits flat on all four standoffs; USB ports reachable through the slots.
    - Pico doesn't lift when you unplug a jumper.
    fail:
    - 'Holes off: measure your E4 hole spacing, set it in `tools/cad/parts.py` (CTL-10b), `make parts`, reprint.'
    record: Tick the boxes; `make done id=M10.1`.
  - id: M10.2
    title: WiFi and Bluetooth
    time: 30 min
    needs:
    - phone or laptop Bluetooth
    do:
    - 'In `software/config/machine.yaml`: `controller.transport: tcp`; `opengonio status`.'
    - 'Pair the E4 over Bluetooth; set `transport: serial`, `port: /dev/rfcomm0` (or the COM port); `opengonio status`.'
    - Set it back to the link you will use.
    verify:
    - Both links print `<Idle|MPos:` or `<Alarm|MPos:`.
    fail:
    - 'Bluetooth missing: flash the BT build from installer.fluidnc.com.'
    record: C1 (WiFi, BT) in `test.csv`.
  - id: M10.3
    title: Flags and homing
    time: 30 min
    needs:
    - LAR-05 endstop
    - 'CTL-06: 3 double-ended XH leads + two 3-pin housings'
    - a card to block it
    do:
    - 'Endstop lead: push 3 leads into a 3-pin XH housing at each end, same order both ends (V, G, S from the E4 pin table). One end into the E4 X-MIN socket, the other onto the module''s 3 pins (an XH
      housing fits a 2.54 mm header).'
    - '`opengonio send ''?''` with the slot open, then blocked.'
    - 'Motor on X, endstop flag taped to the shaft: `opengonio send ''$HX''`.'
    verify:
    - Blocked shows `Pn:X`; open shows no `Pn`.
    - '`$HX` turns until the flag cuts the slot and stops; `?` shows MPos X = 20.'
    fail:
    - 'Never stops: inverted input; toggle `:low` on the home pin in config.yaml.'
    - 'Module LED never lights: V and G swapped (flip the housing at the module end).'
    record: C2, C3 in `test.csv`.
  - id: M10.4
    title: E-stop sense on the breadboard
    time: 30 min
    needs:
    - PWR-10 PC817
    - PWR-11 10 k
    - 2 cut jumpers
    - M-F jumpers
    do:
    - PC817 across the breadboard trench (dot = pin 1). 10 k from pin 1's row to a free row (*24 V sense*).
    - Cut jumper from E4 VIN `+` (bare end under the screw with the main lead) → *24 V sense* row; another from E4 VIN `−` → pin 2's row.
    - Pin 4's row → Pico GP7; pin 3's row → Pico GND (male–female jumpers).
    - 'Motor holding (`opengonio send ''$ME''`): measure E4 VIN (T4). Press the e-stop: watch the hub output and the panel; release; `opengonio home`.'
    verify:
    - T4 ≥ 23.0 V.
    - Hub prints `POWER 0` on e-stop, `POWER 1` after release (T7); moves refused until HOME (C7).
    fail:
    - 'Always `POWER 0`: PC817 backwards (pins 1/2 vs 3/4) or the 10 k in the wrong row.'
    - 'Always `POWER 1`: pin 4 not on GP7, or pin 3 not on GND.'
    record: T4, T7 in `phases/01-power/test.csv`; C7 in `phases/02-controller/test.csv`.
  - id: M10.5
    title: Heat
    time: 10 min
    wait: 30 min hold
    needs:
    - TLS-05 temperature probe
    do:
    - '`opengonio send ''$ME''`, motor holding at 0.8 A run current for 30 min, lid on; probe on the driver area.'
    verify:
    - Driver area ≤ 80 °C (C8).
    fail:
    - 'Hotter: fit the optional CTL-08 fan on `M62 P2`, or lower `run_amps` to 0.7.'
    record: C8 in `test.csv`; commit `make publish m="M10 controller done"`.
