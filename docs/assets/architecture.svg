<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<style>.t{fill:#f0f6fc} .m{fill:#8b949e} .b{font-weight:600} </style>
<rect width="1200" height="410" rx="14" fill="#0d1117"/>
<rect x="30" y="20" width="250" height="62" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="44" y="46" class="t b" font-size="15">Power</text><text x="44" y="68" class="m" font-size="12">60 W adapter · fuse · E-STOP</text><rect x="30" y="110" width="250" height="70" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="44" y="136" class="t b" font-size="15">Laptop (mode 1)</text><text x="44" y="158" class="m" font-size="12">control · capture · processing</text><rect x="30" y="205" width="250" height="70" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="44" y="231" class="t b" font-size="15">Pi Zero 2 W (mode 2)</text><text x="44" y="253" class="m" font-size="12">no laptop: runs jobs, saves data</text><rect x="30" y="320" width="250" height="62" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="44" y="346" class="t b" font-size="15">USB camera (fixed)</text><text x="44" y="368" class="m" font-size="12">on the laptop or the Pi</text><rect x="450" y="70" width="280" height="90" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="2"/><text x="464" y="96" class="t b" font-size="15">FYSETC E4 · FluidNC</text><text x="464" y="118" class="m" font-size="12">ESP32 · 4 × TMC2209 · WebUI</text><rect x="450" y="280" width="280" height="90" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="2"/><text x="464" y="306" class="t b" font-size="15">Pico panel</text><text x="464" y="328" class="m" font-size="12">buttons · OLED · e-stop sense · LEDs</text><rect x="900" y="20" width="270" height="62" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="914" y="46" class="t b" font-size="15">M1 – M4 steppers</text><text x="914" y="68" class="m" font-size="12">optical homing · safety switches</text><rect x="900" y="100" width="270" height="62" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="914" y="126" class="t b" font-size="15">Lights</text><text x="914" y="148" class="m" font-size="12">white COB · 8-band LEDs</text><rect x="900" y="180" width="270" height="52" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="914" y="206" class="t b" font-size="15">PAUSE button</text><text x="914" y="228" class="m" font-size="12">feed hold on the E4</text><rect x="900" y="260" width="270" height="62" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="914" y="286" class="t b" font-size="15">Buttons + OLED</text><text x="914" y="308" class="m" font-size="12">NEXT · START · STOP · HOME · LIGHT</text><rect x="900" y="345" width="270" height="52" rx="10" fill="#161b22" stroke="#8b949e" stroke-width="2"/><text x="914" y="371" class="t b" font-size="15">Phone (no computer)</text><text x="914" y="393" class="m" font-size="12">WebUI: jog, home</text><line x1="280" y1="51" x2="450" y2="95" stroke="#f0883e" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><text x="365.0" y="65.0" fill="#f0883e" font-size="12" text-anchor="middle">24 V</text><line x1="280" y1="140" x2="450" y2="115" stroke="#bc8cff" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><text x="365.0" y="119.5" fill="#bc8cff" font-size="12" text-anchor="middle">USB · WiFi · BT</text><line x1="280" y1="240" x2="450" y2="135" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><text x="365.0" y="179.5" fill="#3fb950" font-size="12" text-anchor="middle">WiFi</text><line x1="280" y1="155" x2="450" y2="300" stroke="#bc8cff" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><text x="365.0" y="219.5" fill="#bc8cff" font-size="12" text-anchor="middle">USB</text><line x1="280" y1="255" x2="450" y2="330" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><text x="365.0" y="284.5" fill="#3fb950" font-size="12" text-anchor="middle">UART</text><line x1="155" y1="320" x2="155" y2="275" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><line x1="730" y1="100" x2="900" y2="51" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><line x1="730" y1="120" x2="900" y2="131" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><line x1="900" y1="206" x2="730" y2="140" stroke="#f0883e" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><line x1="900" y1="291" x2="730" y2="325" stroke="#f0883e" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><line x1="900" y1="371" x2="730" y2="150" stroke="#8b949e" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line>
</svg>
