<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<style>.t{fill:#f0f6fc} .m{fill:#8b949e} .b{font-weight:600} </style>
<rect width="1200" height="460" rx="14" fill="#0d1117"/>
