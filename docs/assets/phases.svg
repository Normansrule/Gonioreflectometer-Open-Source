<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<style>.t{fill:#f0f6fc} .m{fill:#8b949e} .b{font-weight:600} </style>
<rect width="1200" height="210" rx="14" fill="#0d1117"/>
<line x1="60" y1="120" x2="1140" y2="120" stroke="#30363d" stroke-width="3"/><circle cx="60" cy="120" r="6" fill="#f0883e"><animate attributeName="cx" from="60" to="1140" dur="6s" repeatCount="indefinite"/></circle><rect x="20" y="60" width="175" height="120" rx="12" fill="#161b22" stroke="#f0883e" stroke-width="2"><animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></rect><text x="34" y="92" fill="#f0883e" font-size="13" class="b">PHASE 1</text><text x="34" y="118" class="t b" font-size="14">In-plane BRDF</text><text x="34" y="140" class="m" font-size="12">M4 + M3 · camera</text><text x="34" y="164" fill="#3fb950" font-size="13">cap $350</text><rect x="215" y="60" width="175" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"></rect><text x="229" y="92" fill="#8b949e" font-size="13" class="b">PHASE 2</text><text x="229" y="118" class="t b" font-size="14">Calibrated → engine</text><text x="229" y="140" class="m" font-size="12">HDR · GGX fit</text><text x="229" y="164" fill="#3fb950" font-size="13">cap $74</text><rect x="410" y="60" width="175" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"></rect><text x="424" y="92" fill="#8b949e" font-size="13" class="b">PHASE 3</text><text x="424" y="118" class="t b" font-size="14">Isotropic BRDF</text><text x="424" y="140" class="m" font-size="12">+ M2 tilt</text><text x="424" y="164" fill="#3fb950" font-size="13">cap $23</text><rect x="605" y="60" width="175" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"></rect><text x="619" y="92" fill="#8b949e" font-size="13" class="b">PHASE 4</text><text x="619" y="118" class="t b" font-size="14">Anisotropic · SVBRDF</text><text x="619" y="140" class="m" font-size="12">+ M1 spin</text><text x="619" y="164" fill="#3fb950" font-size="13">cap $23</text><rect x="800" y="60" width="175" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"></rect><text x="814" y="92" fill="#8b949e" font-size="13" class="b">PHASE 5</text><text x="814" y="118" class="t b" font-size="14">Multispectral</text><text x="814" y="140" class="m" font-size="12">8-band LEDs · polarizer</text><text x="814" y="164" fill="#3fb950" font-size="13">cap $30</text><rect x="995" y="60" width="175" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"></rect><text x="1009" y="92" fill="#8b949e" font-size="13" class="b">PHASE 6</text><text x="1009" y="118" class="t b" font-size="14">Scan + SVBRDF maps</text><text x="1009" y="140" class="m" font-size="12">software only</text><text x="1009" y="164" fill="#3fb950" font-size="13">cap $0</text><text x="24" y="36" class="t b" font-size="18">Build once, extend each phase</text>
</svg>
