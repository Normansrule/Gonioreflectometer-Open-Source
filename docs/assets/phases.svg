<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 332" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<style>.t{fill:#f0f6fc} .m{fill:#8b949e} .b{font-weight:600} </style>
<rect width="1200" height="332" rx="14" fill="#0d1117"/>
<text x="24" y="36" class="t b" font-size="18">17 phases</text><rect x="700" y="24" width="12" height="12" rx="2" fill="#30363d"/><text x="718" y="35" class="m" font-size="12">setup</text><rect x="820" y="24" width="12" height="12" rx="2" fill="#f0883e"/><text x="838" y="35" class="m" font-size="12">measure</text><rect x="940" y="24" width="12" height="12" rx="2" fill="#58a6ff"/><text x="958" y="35" class="m" font-size="12">3D scan</text><rect x="1060" y="24" width="12" height="12" rx="2" fill="#3fb950"/><text x="1078" y="35" class="m" font-size="12">app + release</text><rect x="24" y="56" width="182" height="76" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.00s" dur="0.4s" fill="freeze"/></rect><text x="36" y="78" fill="#8b949e" font-size="12" class="b">00</text><text x="36" y="98" class="t" font-size="13">Plan</text><rect x="220" y="56" width="182" height="76" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.12s" dur="0.4s" fill="freeze"/></rect><text x="232" y="78" fill="#8b949e" font-size="12" class="b">01</text><text x="232" y="98" class="t" font-size="13">Power box</text><rect x="416" y="56" width="182" height="76" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.24s" dur="0.4s" fill="freeze"/></rect><text x="428" y="78" fill="#8b949e" font-size="12" class="b">02</text><text x="428" y="98" class="t" font-size="13">Controller and buttons</text><rect x="612" y="56" width="182" height="76" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.36s" dur="0.4s" fill="freeze"/></rect><text x="624" y="78" fill="#8b949e" font-size="12" class="b">03</text><text x="624" y="98" class="t" font-size="13">Frame</text><rect x="808" y="56" width="182" height="76" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.48s" dur="0.4s" fill="freeze"/></rect><text x="820" y="78" fill="#f0883e" font-size="12" class="b">04</text><text x="820" y="98" class="t" font-size="13">Light arm moves (M4)</text><rect x="1004" y="56" width="182" height="76" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.60s" dur="0.4s" fill="freeze"/></rect><text x="1016" y="78" fill="#f0883e" font-size="12" class="b">05</text><text x="1016" y="98" class="t" font-size="13">Table turns (M3)</text><rect x="24" y="146" width="182" height="76" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.72s" dur="0.4s" fill="freeze"/></rect><text x="36" y="168" fill="#f0883e" font-size="12" class="b">06</text><text x="36" y="188" class="t" font-size="13">First measurement</text><rect x="220" y="146" width="182" height="76" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.84s" dur="0.4s" fill="freeze"/></rect><text x="232" y="168" fill="#f0883e" font-size="12" class="b">07</text><text x="232" y="188" class="t" font-size="13">Calibrate → game</text><text x="232" y="204" class="t" font-size="13">material</text><rect x="416" y="146" width="182" height="76" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.96s" dur="0.4s" fill="freeze"/></rect><text x="428" y="168" fill="#f0883e" font-size="12" class="b">08</text><text x="428" y="188" class="t" font-size="13">Tilt (M2) → full</text><text x="428" y="204" class="t" font-size="13">reflectance (BRDF)</text><rect x="612" y="146" width="182" height="76" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.08s" dur="0.4s" fill="freeze"/></rect><text x="624" y="168" fill="#f0883e" font-size="12" class="b">09</text><text x="624" y="188" class="t" font-size="13">Spin (M1) → brushed</text><text x="624" y="204" class="t" font-size="13">metal and textures</text><rect x="808" y="146" width="182" height="76" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.20s" dur="0.4s" fill="freeze"/></rect><text x="820" y="168" fill="#f0883e" font-size="12" class="b">10</text><text x="820" y="188" class="t" font-size="13">Colour bands and</text><text x="820" y="204" class="t" font-size="13">polarizers</text><rect x="1004" y="146" width="182" height="76" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.32s" dur="0.4s" fill="freeze"/></rect><text x="1016" y="168" fill="#58a6ff" font-size="12" class="b">11</text><text x="1016" y="188" class="t" font-size="13">3D scan: capture</text><rect x="24" y="236" width="182" height="76" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.44s" dur="0.4s" fill="freeze"/></rect><text x="36" y="258" fill="#58a6ff" font-size="12" class="b">12</text><text x="36" y="278" class="t" font-size="13">3D scan: mesh</text><rect x="220" y="236" width="182" height="76" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.56s" dur="0.4s" fill="freeze"/></rect><text x="232" y="258" fill="#58a6ff" font-size="12" class="b">13</text><text x="232" y="278" class="t" font-size="13">Material on the 3D</text><text x="232" y="294" class="t" font-size="13">model</text><rect x="416" y="236" width="182" height="76" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.68s" dur="0.4s" fill="freeze"/></rect><text x="428" y="258" fill="#3fb950" font-size="12" class="b">14</text><text x="428" y="278" class="t" font-size="13">Laptop app</text><rect x="612" y="236" width="182" height="76" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.80s" dur="0.4s" fill="freeze"/></rect><text x="624" y="258" fill="#3fb950" font-size="12" class="b">15</text><text x="624" y="278" class="t" font-size="13">Release</text><rect x="808" y="236" width="182" height="76" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.92s" dur="0.4s" fill="freeze"/></rect><text x="820" y="258" fill="#3fb950" font-size="12" class="b">16</text><text x="820" y="278" class="t" font-size="13">Upgrades (optional)</text>
</svg>
