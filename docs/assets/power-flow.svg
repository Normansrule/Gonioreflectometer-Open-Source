<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<style>.t{fill:#f0f6fc} .m{fill:#8b949e} .b{font-weight:600} </style>
<rect width="1200" height="150" rx="14" fill="#0d1117"/>
<rect x="20" y="50" width="128" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="84.0" y="79" class="t" font-size="13" text-anchor="middle">USB-C charger</text><rect x="166" y="50" width="128" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="230.0" y="79" class="t" font-size="13" text-anchor="middle">PD trigger 20 V</text><line x1="148" y1="74" x2="166" y2="74" stroke="#e3b341" stroke-width="2"/><rect x="312" y="50" width="128" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="376.0" y="79" class="t" font-size="13" text-anchor="middle">CC/CV 24.0 V 1 A</text><line x1="294" y1="74" x2="312" y2="74" stroke="#e3b341" stroke-width="2"/><rect x="458" y="50" width="128" height="48" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="522.0" y="79" class="t" font-size="13" text-anchor="middle">Battery 6S + BMS</text><line x1="440" y1="74" x2="458" y2="74" stroke="#e3b341" stroke-width="2"/><rect x="604" y="50" width="128" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="668.0" y="79" class="t" font-size="13" text-anchor="middle">Fuse 3.15 A T</text><line x1="586" y1="74" x2="604" y2="74" stroke="#e3b341" stroke-width="2"/><rect x="750" y="50" width="128" height="48" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="814.0" y="79" class="t" font-size="13" text-anchor="middle">E-STOP (NC)</text><line x1="732" y1="74" x2="750" y2="74" stroke="#e3b341" stroke-width="2"/><rect x="896" y="50" width="128" height="48" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2"/><text x="960.0" y="79" class="t" font-size="13" text-anchor="middle">J3 over-travel</text><line x1="878" y1="74" x2="896" y2="74" stroke="#e3b341" stroke-width="2"/><rect x="1042" y="50" width="128" height="48" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="2"/><text x="1106.0" y="79" class="t" font-size="13" text-anchor="middle">SKR Pico</text><line x1="1024" y1="74" x2="1042" y2="74" stroke="#e3b341" stroke-width="2"/><circle cy="74" r="5" fill="#e3b341"><animate attributeName="cx" from="20" to="1170" dur="3s" repeatCount="indefinite"/></circle><text x="20" y="132" class="m" font-size="12">A 24 V Li-ion pack with its own protection board runs the machine (~6 h per charge); USB-C charges it to 24.0 V, plugged in or not. No mains. E-STOP (also the off switch) or an over-travel switch cuts motor power; the laptop keeps running. Screw terminals and lever connectors only.</text>
</svg>
