<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 236" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<style>.t{fill:#f0f6fc} .m{fill:#8b949e} .b{font-weight:600} </style>
<rect width="1200" height="236" rx="14" fill="#0d1117"/>
<text x="24" y="36" class="t b" font-size="18">Measuring loop (stages 06–07)</text><text x="24" y="56" class="m" font-size="13">Same commands on the simulator (--sim) and on the machine. Calibration feeds every later capture.</text><rect x="24" y="70" width="206" height="76" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="38" y="96" class="t b" font-size="15">opengonio capture</text><text x="38" y="118" class="m" font-size="12">mirror · inplane · isotropic</text><text x="38" y="136" class="m" font-size="11">images + manifest.json</text><rect x="262" y="70" width="206" height="76" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/><text x="276" y="96" class="t b" font-size="15">opengonio verify</text><text x="276" y="118" class="m" font-size="12">PASS · WARN · FAIL</text><text x="276" y="136" class="m" font-size="11">angles, drift, saturation</text><line x1="230" y1="108" x2="262" y2="108" stroke="#e3b341" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><rect x="500" y="70" width="206" height="76" rx="10" fill="#161b22" stroke="#f0883e" stroke-width="2"/><text x="514" y="96" class="t b" font-size="15">opengonio calibrate</text><text x="514" y="118" class="m" font-size="12">calibration.yaml</text><text x="514" y="136" class="m" font-size="11">offset · dark · gamma · white</text><line x1="468" y1="108" x2="500" y2="108" stroke="#f0883e" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><rect x="738" y="70" width="206" height="76" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="752" y="96" class="t b" font-size="15">opengonio curve</text><text x="752" y="118" class="m" font-size="12">curve.csv + curve.svg</text><text x="752" y="136" class="m" font-size="11">θi θr φ · BRDF in 1/sr</text><line x1="706" y1="108" x2="738" y2="108" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><rect x="976" y="70" width="206" height="76" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/><text x="990" y="96" class="t b" font-size="15">opengonio fit</text><text x="990" y="118" class="m" font-size="12">fit.json + fit.svg</text><text x="990" y="136" class="m" font-size="11">base · roughness · metallic</text><line x1="944" y1="108" x2="976" y2="108" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1s" repeatCount="indefinite"/></line><path d="M603.0,146 C603.0,210 127.0,210 127.0,146" fill="none" stroke="#f0883e" stroke-width="2" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="28" dur="1s" repeatCount="indefinite"/></path><text x="365.0" y="216" fill="#f0883e" font-size="12" text-anchor="middle">offsets and gamma used by the next capture</text>
</svg>
