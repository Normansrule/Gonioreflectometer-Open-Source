<text x="24" y="34" class="t b" font-size="18">10 · Colour add-ons (optional)</text><text x="24" y="56" class="m" font-size="13">2 milestones · 8 steps · ~5.5 h hands-on · each chip is one GitHub issue</text><rect x="900" y="42" width="12" height="12" rx="3" fill="#3fb950"/><text x="918" y="53" class="m" font-size="12">done</text><rect x="990" y="42" width="12" height="12" rx="3" fill="#f0883e"/><text x="1008" y="53" class="m" font-size="12">next</text><rect x="1080" y="42" width="12" height="12" rx="3" fill="#30363d"/><text x="1098" y="53" class="m" font-size="12">to do</text><line x1="24" x2="1176" y1="70" y2="70" stroke="#30363d" stroke-width="1"/><text x="24" y="96" class="t b" font-size="14">M29</text><text x="70" y="96" class="t" font-size="14">Spectral sensor (optional kit)</text><text x="24" y="132" class="m" font-size="11">Colour spectrum of the spot at the zero</text><text x="24" y="147" class="m" font-size="11">point; camera stays for images.</text><rect x="290" y="78" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="300" y="97" fill="#8b949e" font-size="11" class="b">M29.1</text><text x="494" y="97" class="m" font-size="11" text-anchor="end">30 min</text><text x="300" y="117" class="t" font-size="13">Mount</text><text x="300" y="131" class="m" font-size="10">+ print 1 h</text><rect x="514" y="78" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="524" y="97" fill="#8b949e" font-size="11" class="b">M29.2</text><text x="718" y="97" class="m" font-size="11" text-anchor="end">20 min</text><text x="524" y="117" class="t" font-size="13">Wire and read</text><line x1="504" x2="514" y1="107.0" y2="107.0" stroke="#30363d" stroke-width="2"/><rect x="738" y="78" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="748" y="97" fill="#8b949e" font-size="11" class="b">M29.3</text><text x="942" y="97" class="m" font-size="11" text-anchor="end">10 mi