<text x="24" y="34" class="t b" font-size="18">02 · Controller and buttons</text><text x="24" y="56" class="m" font-size="13">4 milestones · 13 steps · ~4.8 h hands-on · each chip is one GitHub issue</text><rect x="900" y="42" width="12" height="12" rx="3" fill="#3fb950"/><text x="918" y="53" class="m" font-size="12">done</text><rect x="990" y="42" width="12" height="12" rx="3" fill="#f0883e"/><text x="1008" y="53" class="m" font-size="12">next</text><rect x="1080" y="42" width="12" height="12" rx="3" fill="#30363d"/><text x="1098" y="53" class="m" font-size="12">to do</text><line x1="24" x2="1176" y1="70" y2="70" stroke="#30363d" stroke-width="1"/><text x="24" y="96" class="t b" font-size="14">M07</text><text x="70" y="96" class="t" font-size="14">Order controller parts</text><text x="24" y="132" class="m" font-size="11">E4, Pico H, keypads, one motor and one</text><text x="24" y="147" class="m" font-size="11">endstop on the bench.</text><rect x="290" y="78" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="300" y="97" fill="#8b949e" font-size="11" class="b">M07.1</text><text x="494" y="97" class="m" font-size="11" text-anchor="end">30 min</text><text x="300" y="117" class="t" font-size="13">Order</text><text x="300" y="131" class="m" font-size="10">+ shipping 3–10 days</text><rect x="514" y="78" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="524" y="97" fill="#8b949e" font-size="11" class="b">M07.2</text><text x="718" y="97" class="m" font-size="11" text-anchor="end">10 min</text><text x="524" y="117" class="t" font-size="13">Unpack and check</text><line x1="504" x2="514" y1="107.0" y2="107.0" stroke="#30363d" stroke-width="2"/><line x1="24" x2="1176" y1="172" y2="172" stroke="#30363d" stroke-width="1"/><text x="24" y="198" class="t b" font-size="14">M08</text><text x="70" y="198" class="t" font-size="14">One motor turns from the</text><text x="70" y="215" class="t" font-size="14">laptop</text><text x="24" y="234" class="m" font-size="11">Laptop → E4 → motor works on the bench.</text><rect x="290" y="180" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="300" y="199" fill="#8b949e" font-size="11" class="b">M08.1</text><text x="494" y="199" class="m" font-size="11" text-anchor="end">15 min</text><text x="300" y="219" class="t" font-size="13">USB into Ubuntu</text><rect x="514" y="180" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="524" y="199" fill="#8b949e" font-size="11" class="b">M08.2</text><text x="718" y="199" class="m" font-size="11" text-anchor="end">20 min</text><text x="524" y="219" class="t" font-size="13">Flash FluidNC</text><line x1="504" x2="514" y1="209.0" y2="209.0" stroke="#30363d" stroke-width="2"/><rect x="738" y="180" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="748" y="199" fill="#8b949e" font-size="11" class="b">M08.3</text><text x="942" y="199" class="m" font-size="11" text-anchor="end">20 min</text><text x="748" y="219" class="t" font-size="13">Bench motor</text><line x1="728" x2="738" y1="209.0" y2="209.0" stroke="#30363d" stroke-width="2"/><line x1="24" x2="1176" y1="274" y2="274" stroke="#30363d" stroke-width="1"/><text x="24" y="300" class="t b" font-size="14">M09</text><text x="70" y="300" class="t" font-size="14">Keypads work with the laptop</text><text x="24" y="336" class="m" font-size="11">Membrane keys drive the machine.</text><rect x="290" y="282" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="300" y="301" fill="#8b949e" font-size="11" class="b">M09.1</text><text x="494" y="301" class="m" font-size="11" text-anchor="end">15 min</text><text x="300" y="321" class="t" font-size="13">Hub firmware</text><rect x="514" y="282" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="524" y="301" fill="#