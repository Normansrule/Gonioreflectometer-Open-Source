<text x="24" y="34" class="t b" font-size="18">03 · Frame</text><text x="24" y="56" class="m" font-size="13">2 milestones · 7 steps · ~3.3 h hands-on · each chip is one GitHub issue</text><rect x="900" y="42" width="12" height="12" rx="3" fill="#3fb950"/><text x="918" y="53" class="m" font-size="12">done</text><rect x="990" y="42" width="12" height="12" rx="3" fill="#f0883e"/><text x="1008" y="53" class="m" font-size="12">next</text><rect x="1080" y="42" width="12" height="12" rx="3" fill="#30363d"/><text x="1098" y="53" class="m" font-size="12">to do</text><line x1="24" x2="1176" y1="70" y2="70" stroke="#30363d" stroke-width="1"/><text x="24" y="96" class="t b" font-size="14">M11</text><text x="70" y="96" class="t" font-size="14">Place the base mounts</text><text x="24" y="132" class="m" font-size="11">Every mount screwed to the board from a</text><text x="24" y="147" class="m" font-size="11">paper template; no cutting, no drilling.</text><rect x="290" y="78" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="300" y="97" fill="#8b949e" font-size="11" class="b">M11.1</text><text x="494" y="97" class="m" font-size="11" text-anchor="end">20 min</text><text x="300" y="117" class="t" font-size="13">Order frame parts</text><text x="300" y="131" class="m" font-size="10">+ shipping</text><rect x="514" y="78" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="524" y="97" fill="#8b949e" font-size="11" class="b">M11.2</text><text x="718" y="97" class="m" font-size="11" text-anchor="end">30 min</text><text x="524" y="117" class="t" font-size="13">Print the template and moun…</text><text x="524" y="131" class="m" font-size="10">+ print 4 h</text><line x1="504" x2="514" y1="107.0" y2="107.0" stroke="#30363d" stroke-width="2"/><rect x="738" y="78" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="748" y="97" fill="#8b949e" font-size="11" class="b">M11.3</text><text x="942" y="97" class="m" font-size="11" text-anchor="end">45 min</text><text x="748" y="117" class="t" font-size="13">Screw down the mounts</text><line x1="728" x2="738" y1="107.0" y2="107.0" stroke="#30363d" stroke-width="2"/><line x1="24" x2="1176" y1="172" y2="172" stroke="#30363d" stroke-width="1"/><text x="24" y="198" class="t b" font-size="14">M12</text><text x="70" y="198" class="t" font-size="14">Assemble the frame</text><text x="24" y="234" class="m" font-size="11">Board on feet with outrigger, camera</text><text x="24" y="249" class="m" font-size="11">post, scales and boxes.</text><rect x="290" y="180" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="300" y="199" fill="#8b949e" font-size="11" class="b">M12.1</text><text x="494" y="199" class="m" font-size="11" text-anchor="end">15 min</text><text x="300" y="219" class="t" font-size="13">Feet</text><rect x="514" y="180" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="524" y="199" fill="#8b949e" font-size="11" class="b">M12.2</text><text x="718" y="199" class="m" font-size="11" text-anchor="end">45 min</text><text x="524" y="219" class="t" font-size="13">Outrigger and camera posts</text><text x="524" y="233" class="m" font-size="10">+ print 3 h</text><line x1="504" x2="514" y1="209.0" y2="209.0" stroke="#30363d" stroke-width="2"/><rect x="738" y="180" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="748" y="199" fill="#8b949e" font-size="11" class="b">M12.3</text><text x="942" y="199" class="m" font-size="11" text-anchor="end">30 min</text><text x="748" y="219" class="t" font-size="13">Protractor scales</text><text x="748" y="233" class="m" font-size="10">+ print 2 h</text><line x1="728" x2="738" y1="209.0" y2="209.0" stroke="#30363d" stroke-width="2"/><rect x="962" y="180" width="214" height="58" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text x="972" y="199" fill="#8b949e" font-size="11" class="b">M12.4</text><text x="1166" y="199" class="m" font-size="11" text-anchor="end">15 min</text><text x="972" y="219" class="t" font-size="13">Mount the boxes</text><line x1="952" x2="962" y1="209.0" y2="209.0" stroke="#30363d" stroke-width="2"/>
</svg>
