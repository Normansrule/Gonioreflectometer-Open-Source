# OpenGantry Lite - Klipper configuration for BIGTREETECH SKR Mini E3 V3.0
# SPDX-License-Identifier: GPL-3.0-or-later
#
# Units: every manual_stepper uses rotation_distance = 360 / gear_ratio, so ONE
# KLIPPER UNIT = ONE DEGREE of arm/ring/turntable rotation.
# Pins: SKR Mini E3 V3.0 (STM32G0B1). Verify against BTT's pin PDF in
#   https://github.com/bigtreetech/BIGTREETECH-SKR-mini-E3/tree/master/hardware/BTT%20SKR%20MINI%20E3%20V3.0/Hardware
# and Klipper's config/generic-bigtreetech-skr-mini-e3-v3.0.cfg before first power-up.
#
# Phase map:  A1 -> X driver   A2 -> Y driver   A3 -> Z driver   A4 -> E0 driver
#             main light -> HE0 (PC8)   fill light -> FAN2 (PB15)   controller fan -> FAN1 (PC7)

[mcu]
# Pi UART on the SKR TFT header (TX2/RX2). Do NOT connect the header's 5V pin to the Pi.
serial: /dev/ttyAMA0
baud: 250000
restart_method: command
# USB alternative: serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_...-if00

[printer]
kinematics: none
max_velocity: 60          # deg/s
max_accel: 300            # deg/s^2

# ---------------------------------------------------------------- Phase 1: A1
[manual_stepper a1_camera_el]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 72     # 5:1 belt reduction -> 72 deg of arm per motor rev
velocity: 20
accel: 100
endstop_pin: ^PC0         # X-STOP, TCST2103 slot flag at A1 = 85 deg

[tmc2209 manual_stepper a1_camera_el]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.80
stealthchop_threshold: 999999   # StealthChop everywhere: smooth and quiet during exposures

# ---------------------------------------------------------------- Phase 1: A2
[manual_stepper a2_light_el]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 72
velocity: 20
accel: 100
endstop_pin: ^PC1         # Y-STOP

[tmc2209 manual_stepper a2_light_el]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.80
stealthchop_threshold: 999999

# ---------------------------------------------------------------- Phase 3: A3 (uncomment)
#[manual_stepper a3_light_az]
#step_pin: PB0
#dir_pin: PC5
#enable_pin: !PB1
#microsteps: 16
#full_steps_per_rotation: 200
#rotation_distance: 15    # 360 / 24 (set from the measured ring rim pitch diameter)
#velocity: 10
#accel: 40
#endstop_pin: ^PC2        # Z-STOP
#
#[tmc2209 manual_stepper a3_light_az]
#uart_pin: PC11
#tx_pin: PC10
#uart_address: 1
#run_current: 0.80
#stealthchop_threshold: 999999

# ---------------------------------------------------------------- Phase 4: A4 (uncomment)
#[manual_stepper a4_turntable]
#step_pin: PB3
#dir_pin: !PB4
#enable_pin: !PD1
#microsteps: 16
#full_steps_per_rotation: 200
#rotation_distance: 90    # 4:1
#velocity: 30
#accel: 120
#endstop_pin: ^PC15       # E0-STOP
#
#[tmc2209 manual_stepper a4_turntable]
#uart_pin: PC11
#tx_pin: PC10
#uart_address: 3
#run_current: 0.70
#stealthchop_threshold: 999999

# ---------------------------------------------------------------- lights and fan
[output_pin main_light]
pin: PC8                  # HE0 MOSFET switches the NLDD-350H input (low side). On/off only, no PWM.
pwm: False
value: 0
shutdown_value: 0

#[output_pin fill_light]  # Phase 5
#pin: PB15                # FAN2
#pwm: False
#value: 0
#shutdown_value: 0

[controller_fan controller_fan]
pin: PC7                  # FAN1 -> 40 mm 24 V fan in the controller case
idle_timeout: 30          # runs while any stepper is enabled, stops 30 s after M84

# ---------------------------------------------------------------- power management
[idle_timeout]
timeout: 300              # 5 min idle -> sleep (drivers, light, fan off)
gcode:
  OG_SLEEP

[gcode_macro OG_SLEEP]
description: Sleep mode - lights off, drivers off (controller fan follows 30 s later). Re-home or encoder-verify afterwards.
gcode:
  SET_PIN PIN=main_light VALUE=0
  {% if printer["output_pin fill_light"] is defined %}SET_PIN PIN=fill_light VALUE=0{% endif %}
  M84

[gcode_macro OG_WAKE]
description: Leave sleep mode. Steppers (and the controller fan) enable on the next MANUAL_STEPPER command.
gcode:
  G4 P1
